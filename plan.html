<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#1c1b19; --muted:#6b675f; --line:#d9d4c9; --soft:#efe9df; --sheet:#fbf9f4;
  --accent:#9a4a1f; --accent-ink:#fff; --accent-bg:#f6e9df;
  --ok:#2b8a3e; --ok-bg:#ebfbee; --warn:#a85a00; --warn-bg:#fff4e6; --bad:#c92a2a; --bad-bg:#ffe3e3;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 12px 32px rgba(28,27,25,.18);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161614; --panel:#1c1b19; --ink:#e9e5dc; --muted:#9a958a; --line:#2f2d29; --soft:#252320; --sheet:#181816;
    --accent:#e08a55; --accent-ink:#1a0d05; --accent-bg:#33231a;
    --ok:#69db7c; --ok-bg:#17291c; --warn:#ffc078; --warn-bg:#3a2a12; --bad:#ffa8a8; --bad-bg:#3d1818;
    --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.input{background:var(--sheet);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:16px /* keeps iOS from zooming in on focus */;font-variant-numeric:tabular-nums}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.input::placeholder{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{font-size:12px;color:var(--muted);margin:8px 0 0}

/* Top bar, as on every zbCAD tool */
.top{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;min-width:0;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand a{color:var(--muted);text-decoration:none}
.brand a:hover,.brand a:focus-visible{color:var(--accent)}
.brand .sep{color:var(--line);margin:0 7px;font-weight:400}
.brand .name{overflow:hidden;text-overflow:ellipsis}
.header-right{position:relative;display:flex;align-items:center;gap:10px;flex-shrink:0}
.bell{position:relative;display:flex;padding:7px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.bell:hover{border-color:var(--muted)}
.bell.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.bell.partial::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.clock-time{font-size:20px;font-weight:600;line-height:1;white-space:nowrap}
.clock-time .ampm{font-size:.6em;font-weight:500;margin-left:3px;color:var(--muted)}

.app{max-width:560px;margin:0 auto;padding:16px 16px 96px}

/* Alerts & display panel */
.panel{position:absolute;top:calc(100% + 10px);right:0;z-index:40;width:min(300px,calc(100vw - 32px));padding:6px;box-shadow:var(--shadow)}
.switch-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:6px;text-align:left}
.switch-row:hover:not(:disabled){background:var(--soft)}
.switch-row:disabled{opacity:.45}
.switch-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.switch-label{font-size:13px;font-weight:600}
.switch-sub{font-size:11.5px;color:var(--muted)}
.switch-sub.warn{color:var(--warn)}
.switch{flex-shrink:0;position:relative;width:36px;height:20px;border-radius:10px;background:var(--line);transition:background-color .15s}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on .knob{transform:translateX(16px)}
.panel-note{font-size:11.5px;line-height:1.4;color:var(--muted);padding:8px 10px 6px;margin-top:4px;border-top:1px solid var(--line)}

/* Deadline + buffer */
.settings{padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px 14px}
.settings .grow{flex:1;min-width:0}
.settings .buffer{width:100px}
.settings .input{width:100%;border-radius:6px;padding:7px 8px;text-align:center;font-size:18px}
.plan-line{flex-basis:100%;font-size:12px;color:var(--muted)}
.label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 6px}
.label .day{text-transform:none;letter-spacing:0;color:var(--accent)}

/* Status panel */
.status{padding:16px;margin-bottom:22px;border-left:4px solid var(--tone);display:grid;grid-template-columns:1fr 1fr;gap:14px;transition:background-color .5s,border-color .5s}
.tone-neutral{--tone:var(--line);--tone-text:var(--muted)}
.tone-green{--tone:var(--ok);--tone-text:var(--ok)}
.tone-yellow{--tone:var(--warn);--tone-text:var(--warn)}
.tone-red{--tone:var(--bad);--tone-text:var(--bad);background:var(--bad-bg)}
.status.all-done.tone-green{background:var(--ok-bg)}
.eyebrow{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.status-line{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--tone-text)}
.status-sub{font-size:12px;margin-top:4px}
.status-sub.ahead{color:var(--ok)}
.status-sub.behind{color:var(--warn)}
.right{text-align:right}
.buffer-left{font-size:24px;font-weight:700}
.buffer-left.pos{color:var(--ok)}
.buffer-left.partial{color:var(--warn)}
.buffer-left.neg{color:var(--bad)}
.finished{font-size:12px;color:var(--muted);margin-top:4px}
.gate-row{grid-column:1/-1;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gate{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gate-time{font-size:20px;font-weight:700;color:var(--accent)}
.countdown{font-size:13px;font-weight:600;color:var(--muted)}
.countdown.soon{color:var(--warn)}
.countdown.over{color:var(--bad)}
.eta{font-size:14px}

/* Run summary */
.summary{padding:14px 16px;margin-bottom:22px}
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px 60px;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--soft)}
.sum-row>span:not(:first-child){text-align:right}
.sum-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-head{font-size:11.5px;font-weight:600;color:var(--muted);border-top:0}
.sum-total{font-weight:700;border-top-color:var(--line)}
.over-est{color:var(--bad)}
.under-est{color:var(--ok)}

/* Steps */
.steps-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:26px}
.steps-head .label{margin:0}
.reset{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:5px;color:var(--muted);background:var(--panel)}
.reset:hover{color:var(--ink);border-color:var(--muted)}
.reset.armed{background:var(--bad);border-color:var(--bad);color:var(--panel)}

.task-list{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:24px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
.task{padding:10px 12px;border-left:3px solid var(--line);transition:background-color .2s,border-color .2s,opacity .2s,box-shadow .2s}
.task.paused{border-left-color:var(--muted)}
.task.active{border-color:var(--accent);border-left-width:3px;background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.task.done{border-left-color:var(--ok);opacity:.6}
.task.dragging{opacity:.4}
.task.folded{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 8px}
.fold-row{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px;text-align:left;font-size:13px}
.fold-row:hover{background:var(--soft)}
.fold-check{color:var(--ok);flex-shrink:0}
.fold-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:line-through}
.fold-chip,.fold-when{font-size:11px;white-space:nowrap;flex-shrink:0}
.fold-when{color:var(--muted)}
.fold-up{transform:rotate(180deg)}
@media (max-width:420px){.fold-when{display:none}}
.task-times{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:11px;margin-bottom:6px;padding:0 2px}
.task-times .planned{color:var(--muted)}
.chip-ok{color:var(--ok)}
.chip-late{color:var(--bad)}
.chip-paused{color:var(--muted);font-style:italic}
.task-times .wide{order:3;flex-basis:100%}
.task-main{display:flex;gap:6px;align-items:center}
.grip{display:flex;padding:4px 2px;cursor:move;color:var(--muted);opacity:.6;touch-action:none}
.grip:hover{opacity:1}
.task-name{flex:1;min-width:0;border-radius:6px;padding:5px 8px}
.task-name.struck{text-decoration:line-through}
.dur{position:relative;width:68px;flex-shrink:0}
.dur .input{width:100%;border-radius:6px;padding:5px 22px 5px 6px;text-align:center}
.dur span{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);pointer-events:none}
.task-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-left:22px}
.tools,.act-group{display:flex;gap:2px;align-items:center}
.act-group{gap:6px}
.icon-btn{display:flex;padding:6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{color:var(--ink);background:var(--soft)}
.icon-btn.danger:hover{color:var(--bad);background:var(--bad-bg)}
.icon-btn.ok:hover{color:var(--ok);background:var(--ok-bg)}
.act{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:flex;align-items:center;gap:5px}
.act:hover{border-color:var(--muted)}
.act.start{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.act.start:hover{filter:brightness(1.08)}
.act.finish{background:var(--ok);border-color:var(--ok);color:var(--panel);font-weight:600}
.act.finish:hover{filter:brightness(1.08)}

.add{width:100%;margin-top:12px;padding:11px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500}
.add:hover{color:var(--accent);border-color:var(--accent);background:var(--panel)}

/* Plans & templates */
.plans{margin-top:14px;overflow:hidden}
.plans-head{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600}
.plans-head:hover{background:var(--soft)}
.plans-head .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.plans-head[aria-expanded="true"]{border-bottom:1px solid var(--line)}
.plans-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.plans-body{padding:12px}
.tpl-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.tpl{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border:1px solid var(--soft);border-radius:8px;background:var(--sheet)}
.tpl-info{flex:1;min-width:0}
.tpl-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-meta{font-size:11.5px;color:var(--muted)}
.plans-actions{display:flex;flex-wrap:wrap;gap:6px}
.plans-body>.muted{margin:0 0 12px}

.foot{margin-top:24px;text-align:center;font-size:11.5px;color:var(--muted)}

/* Toast (alerts, below the bar) and undo bar (bottom) */
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:50;width:calc(100% - 32px);max-width:528px;padding:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;border-left:3px solid var(--accent)}
.toast>.icon{color:var(--accent);margin-top:1px;flex-shrink:0}
.toast.info{border-left-color:var(--line)}
.toast.info>.icon{color:var(--muted)}
.toast-text{flex:1;min-width:0}
.toast-title{font-weight:600;font-size:13.5px}
.toast-body{font-size:12.5px;color:var(--muted)}
.toast-close{display:flex;padding:4px;margin:-4px -4px 0 0;border-radius:6px;color:var(--muted)}
.toast-close:hover{color:var(--ink);background:var(--soft)}
.snackbar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:50;width:calc(100% - 32px);max-width:528px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 14px;border-radius:10px;font-size:13px;background:var(--ink);color:var(--panel);box-shadow:var(--shadow)}
.snackbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snack-btn{flex-shrink:0;font-weight:700;color:var(--panel);padding:6px 12px;border-radius:6px}
.snack-btn:hover{background:color-mix(in srgb,var(--panel) 15%,transparent)}

@media (max-width:400px){
  .top{padding:0 12px}
  .brand .long{display:none}
  .clock-time{font-size:18px}
}

.fatal{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);padding:16px;margin:16px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<noscript><div class="fatal">This planner needs JavaScript enabled.</div></noscript>

    <script>
        // --- 1. Setup ---
        const { h, render } = preact;
        const { useState, useEffect, useRef } = preactHooks;
        const html = htm.bind(h);

        // --- 2. Icons (path data from Lucide) ---
        const ICONS = {
            Clock: "M12 6v6l4 2 M22 12A10 10 0 1 1 12 2a10 10 0 0 1 10 10z",
            AlertTriangle: "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01",
            CheckCircle: "M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3",
            PartyPopper: "M5.8 11.3 2 22l10.7-3.79 M4 3h.01 M22 8h.01 M15 2h.01 M22 20h.01 M22 2l-2.24.75a2.9 2.9 0 0 0-1.96 3v0a2.9 2.9 0 0 0 1.96 3L22 9.5V2z M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2z",
            GripVertical: "M9 12h1 M9 5h1 M9 19h1 M15 12h1 M15 5h1 M15 19h1",
            ArrowUp: "M12 19V5 M5 12l7-7 7 7",
            ArrowDown: "M12 5v14 M19 12l-7 7-7-7",
            Trash2: "M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2 M10 11v6 M14 11v6",
            Play: "M5 3l14 9-14 9V3z",
            Pause: "M6 4h4v16H6z M14 4h4v16h-4z",
            Check: "M20 6L9 17l-5-5",
            RotateCcw: "M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5",
            Plus: "M12 5v14 M5 12h14",
            X: "M18 6L6 18 M6 6l12 12",
            Info: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 16v-4 M12 8h.01",
            Bell: "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0",
            BellOff: "M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5 M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7 M10.3 21a1.94 1.94 0 0 0 3.4 0 M2 2l20 20",
            Bookmark: "M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z",
            Download: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3",
            Upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12",
            ChevronDown: "M6 9l6 6 6-6"
        };

        const Icon = ({ name, size = 20, className = '' }) => html`
            <svg class=${'icon ' + className} width=${size} height=${size} viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d=${ICONS[name]} />
            </svg>`;

        // --- 3. Time + formatting helpers ---
        const MIN = 60 * 1000;
        const HOUR = 60 * MIN;
        const MAX_MINS = 24 * 60;
        const STORAGE_KEY = 'deadlinePlannerData_v3';
        const ALERTS_KEY = 'deadlinePlannerFiredAlerts_v1';
        const TEMPLATES_KEY = 'deadlinePlannerTemplates_v1';

        const pad = (n) => n.toString().padStart(2, '0');
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const sameId = (a, b) => String(a) === String(b);
        const clampMins = (v) => {
            const n = Math.round(Number(v));
            return Number.isFinite(n) ? Math.min(MAX_MINS, Math.max(0, n)) : 0;
        };

        // Default to the device's 12/24-hour preference; the setting in the alerts panel overrides it.
        const prefers12h = (() => {
            try {
                const hc = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hourCycle;
                if (hc) return hc === 'h12' || hc === 'h11';
                return /am|pm/i.test(new Date(2020, 0, 1, 13).toLocaleTimeString());
            } catch (e) { return false; }
        })();
        let use12h = prefers12h; // updated from state on every render

        const timeParts = (ms) => {
            const d = new Date(ms);
            const hh = d.getHours(), mm = pad(d.getMinutes());
            if (!use12h) return { hm: `${pad(hh)}:${mm}`, suffix: '' };
            return { hm: `${hh % 12 || 12}:${mm}`, suffix: hh < 12 ? 'AM' : 'PM' };
        };
        const fmtTime = (ms) => { const p = timeParts(ms); return p.suffix ? `${p.hm} ${p.suffix}` : p.hm; };
        const toTimeInput = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
        const fmtClockStr = (hhmm) => { const [hh, mm] = hhmm.split(':').map(Number); return fmtTime(new Date(2020, 0, 1, hh, mm).getTime()); };

        const fmtDur = (mins) => {
            const m = Math.round(Math.abs(mins));
            if (m < 60) return `${m}m`;
            return m % 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m / 60}h`;
        };
        const fmtSigned = (mins) => mins === 0 ? '0m' : `${mins > 0 ? '+' : '−'}${fmtDur(mins)}`;
        const toMins = (ms) => Math.round(ms / MIN);

        // Positive = early (credit), negative = late.
        const earlyLate = (mins) => mins === 0 ? 'on time' : `${fmtDur(mins)} ${mins > 0 ? 'early' : 'late'}`;

        // Pick the occurrence of HH:MM nearest to now (6h back to 18h ahead), so a 01:00
        // deadline set at 23:00 lands tomorrow instead of 22 hours in the past.
        const resolveDeadline = (timeStr, nowMs) => {
            const [h, m] = timeStr.split(':').map(Number);
            const d = new Date(nowMs);
            d.setHours(h, m, 0, 0);
            if (d.getTime() < nowMs - 6 * HOUR) d.setDate(d.getDate() + 1);
            else if (d.getTime() > nowMs + 18 * HOUR) d.setDate(d.getDate() - 1);
            return d.getTime();
        };
        const isStale = (deadlineAt, nowMs) => deadlineAt < nowMs - 12 * HOUR;

        const dayOffset = (ms, nowMs) => {
            const d = new Date(ms); d.setHours(0, 0, 0, 0);
            const t = new Date(nowMs); t.setHours(0, 0, 0, 0);
            return Math.round((d - t) / (24 * HOUR));
        };
        const dayLabel = (ms, nowMs) => {
            const days = dayOffset(ms, nowMs);
            if (days === 0) return '';
            if (days === 1) return 'tomorrow';
            if (days === -1) return 'yesterday';
            return new Date(ms).toLocaleDateString(undefined, { weekday: 'short' });
        };
        // Time plus a short day tag when it isn't today, e.g. "12:30 AM tmrw".
        const fmtWhen = (ms, nowMs) => {
            const days = dayOffset(ms, nowMs);
            const tag = days === 0 ? '' : days === 1 ? 'tmrw' : days === -1 ? 'yest'
                : new Date(ms).toLocaleDateString(undefined, { weekday: 'short' });
            return tag ? `${fmtTime(ms)} ${tag}` : fmtTime(ms);
        };

        // --- 4. Task model ---
        // status: pending | active | completed. A pending step with spentMs > 0 is paused.
        // startedAt: start of the current run (active only). spentMs: time from earlier runs.
        // firstStartedAt: first time it was started. completedAt, dueBy (its gate at that moment),
        // actualMs (total time spent; unknown if marked done without timing).
        const stepName = (t) => t.name || 'Untitled step';
        const remainingMs = (t) => Math.max(0, t.duration * MIN - (t.spentMs || 0));
        const freshTask = ({ id, name, duration }) => ({ id, name, duration, status: 'pending' });
        const pauseOf = (t, now) => {
            const { startedAt, ...rest } = t;
            return { ...rest, status: 'pending', spentMs: (t.spentMs || 0) + Math.max(0, now - (startedAt ?? now)) };
        };
        const DEFAULT_TASKS = () => [
            { id: 1, name: "Research", duration: 30, status: "pending" },
            { id: 2, name: "Drafting", duration: 45, status: "pending" },
            { id: 3, name: "Review", duration: 15, status: "pending" }
        ];

        const sanitizeTasks = (list, nowMs) => {
            if (!Array.isArray(list)) return null;
            const ids = new Set();
            let seenActive = false;
            return list.filter(t => t && typeof t === 'object').map((t, i) => {
                let id = t.id ?? `${nowMs.toString(36)}-${i}`;
                if (ids.has(String(id))) id = `${id}-${i}`;
                ids.add(String(id));
                const task = {
                    id,
                    name: typeof t.name === 'string' ? t.name : '',
                    duration: clampMins(t.duration),
                    status: ['pending', 'active', 'completed'].includes(t.status) ? t.status : 'pending'
                };
                if (Number.isFinite(t.spentMs) && t.spentMs > 0) task.spentMs = t.spentMs;
                if (Number.isFinite(t.firstStartedAt)) task.firstStartedAt = t.firstStartedAt;
                if (task.status === 'active') {
                    if (seenActive) {
                        task.status = 'pending';
                    } else {
                        seenActive = true;
                        // Older saves have no start times; treat an active step as started now.
                        task.startedAt = Number.isFinite(t.startedAt) ? t.startedAt : nowMs;
                        task.firstStartedAt = task.firstStartedAt ?? task.startedAt;
                    }
                }
                if (task.status === 'completed') {
                    if (Number.isFinite(t.completedAt)) task.completedAt = t.completedAt;
                    if (Number.isFinite(t.dueBy)) task.dueBy = t.dueBy;
                    if (Number.isFinite(t.actualMs)) task.actualMs = t.actualMs;
                    else if (Number.isFinite(t.startedAt) && Number.isFinite(t.completedAt)) task.actualMs = t.completedAt - t.startedAt;
                    if (task.firstStartedAt == null && Number.isFinite(t.startedAt)) task.firstStartedAt = t.startedAt;
                    delete task.spentMs;
                }
                return task;
            });
        };

        const sanitizeTemplate = (t) => {
            if (!t || typeof t !== 'object' || !Array.isArray(t.steps)) return null;
            return {
                id: String(t.id || uid()),
                name: String(t.name || 'Untitled plan').trim().slice(0, 80) || 'Untitled plan',
                deadline: typeof t.deadline === 'string' && /^\d{2}:\d{2}$/.test(t.deadline) ? t.deadline : null,
                buffer: clampMins(t.buffer ?? 10),
                steps: t.steps.filter(s => s && typeof s === 'object')
                    .map(s => ({ name: typeof s.name === 'string' ? s.name : '', duration: clampMins(s.duration) }))
            };
        };

        // --- 5. Storage ---
        const readJSON = (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } };

        const normalizeSaved = (parsed, nowMs) => {
            const s = {
                deadlineAt: null, buffer: 10, tasks: DEFAULT_TASKS(), alertEpoch: 0,
                alertsOn: false, soundOn: false, keepAwake: true, hour12: prefers12h
            };
            if (parsed && typeof parsed === 'object') {
                if (Number.isFinite(parsed.deadlineAt)) s.deadlineAt = parsed.deadlineAt;
                else if (typeof parsed.deadline === 'string' && /^\d{2}:\d{2}$/.test(parsed.deadline)) s.deadlineAt = resolveDeadline(parsed.deadline, nowMs);
                if (Number.isFinite(parsed.buffer)) s.buffer = clampMins(parsed.buffer);
                if (Number.isFinite(parsed.alertEpoch)) s.alertEpoch = parsed.alertEpoch;
                s.alertsOn = !!parsed.alertsOn;
                s.soundOn = !!parsed.soundOn;
                if (typeof parsed.keepAwake === 'boolean') s.keepAwake = parsed.keepAwake;
                if (typeof parsed.hour12 === 'boolean') s.hour12 = parsed.hour12;
                const tasks = sanitizeTasks(parsed.tasks, nowMs);
                if (tasks) s.tasks = tasks;
            }
            if (!s.deadlineAt) s.deadlineAt = resolveDeadline('17:00', nowMs);
            return s;
        };

        const loadSaved = () => {
            const nowMs = Date.now();
            const s = normalizeSaved(readJSON(STORAGE_KEY), nowMs);
            s.rolledOver = false;
            // Left over from an earlier day: move the deadline to its next occurrence and clear old progress.
            if (isStale(s.deadlineAt, nowMs)) {
                s.rolledOver = s.tasks.some(t => t.status !== 'pending' || t.spentMs);
                s.deadlineAt = resolveDeadline(toTimeInput(s.deadlineAt), nowMs);
                s.tasks = s.tasks.map(freshTask);
            }
            return s;
        };

        const loadFired = () => { const arr = readJSON(ALERTS_KEY); return new Set(Array.isArray(arr) ? arr : []); };
        const saveFired = (set) => { try { localStorage.setItem(ALERTS_KEY, JSON.stringify([...set].slice(-100))); } catch (e) {} };
        const loadTemplates = () => { const arr = readJSON(TEMPLATES_KEY); return Array.isArray(arr) ? arr.map(sanitizeTemplate).filter(Boolean) : []; };

        const ROLLOVER_TOAST = { kind: 'info', title: 'Fresh start', body: "Progress from the last run was cleared and the deadline moved to its next occurrence." };

        // --- 6. Notifications, sound, vibration ---
        // Optional service worker (plan-sw.js next to this file): offline reopening, and the only way phones
        // show system notifications. Without it the app still works; alerts stay in-app.
        // Only available over http(s), not file://. It's told this page's file name so it can cache it,
        // and scoped to this page alone: by default it would claim the whole folder, which on zbcad.com
        // is the whole site, and serve every other tool from its cache.
        const canUseSW = 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
        if (canUseSW) {
            const page = location.pathname.split('/').pop() || './';
            navigator.serviceWorker.register('plan-sw.js?app=' + encodeURIComponent(page), { scope: page }).catch(() => {});
        }
        const APP_ICON = document.querySelector('link[rel="apple-touch-icon"]')?.href;

        // The registration with a running worker, or null. Doesn't wait on `ready`, which never resolves
        // if the worker failed to install.
        const activeRegistration = async () => {
            if (!canUseSW) return null;
            try {
                const reg = await navigator.serviceWorker.getRegistration();
                return reg && reg.active ? reg : null;
            } catch (e) { return null; }
        };

        const notifState = () => ('Notification' in window) ? Notification.permission : 'unsupported';

        const showSystemNotification = async (title, body) => {
            if (notifState() !== 'granted') return;
            const opts = { body, tag: 'deadline-planner', renotify: true, icon: APP_ICON };
            try {
                const reg = await activeRegistration();
                if (reg) await reg.showNotification(title, opts);
                else new Notification(title, opts); // desktop without a worker; throws on Android (caught)
            } catch (e) {}
        };

        // Web Audio beep. Browsers only allow audio after a tap, so the context is unlocked on taps.
        let audioCtx = null;
        let soundWanted = false; // updated from state on every render
        const unlockAudio = () => {
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    audioCtx = new AC();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        };
        ['click', 'touchend', 'keydown'].forEach(ev =>
            document.addEventListener(ev, () => { if (soundWanted) unlockAudio(); }, true));
        const beep = () => {
            try {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const t0 = audioCtx.currentTime + 0.01;
                [0, 0.22].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.setValueAtTime(0.0001, t0 + offset);
                    gain.gain.exponentialRampToValueAtTime(0.3, t0 + offset + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.18);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(t0 + offset);
                    osc.stop(t0 + offset + 0.2);
                });
            } catch (e) {}
        };

        // System notification only when the app isn't on screen; the in-app toast covers the visible case.
        const fireAlert = (alert, soundOn) => {
            if (document.visibilityState !== 'visible') showSystemNotification(alert.title, alert.body);
            if (soundOn) beep();
            try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
        };

        // --- 7. Small components ---
        // Keeps the raw text while the field is focused, so it can be emptied or hold a half-typed value.
        // `onValue` gets every edit and decides whether it's valid; on blur the field shows the saved value again.
        const DraftInput = ({ value, onValue, ...rest }) => {
            const [draft, setDraft] = useState(null);
            return html`<input ...${rest} value=${draft ?? String(value)}
                onFocus=${() => setDraft(String(value))}
                onInput=${(e) => { setDraft(e.target.value); onValue(e.target.value); }}
                onBlur=${() => setDraft(null)} />`;
        };

        const Switch = ({ on, onToggle, label, sub, subClass = '', disabled = false }) => html`
            <button class="switch-row" role="switch" aria-label=${label} aria-checked=${on ? 'true' : 'false'} onClick=${onToggle} disabled=${disabled}>
                <span class="switch-text">
                    <span class="switch-label">${label}</span>
                    ${sub && html`<span class=${'switch-sub ' + subClass}>${sub}</span>`}
                </span>
                <span class=${'switch' + (on ? ' on' : '')} aria-hidden="true"><span class="knob"></span></span>
            </button>`;

        // --- 8. App ---
        const App = () => {
            const [initial] = useState(loadSaved);
            const [deadlineAt, setDeadlineAt] = useState(initial.deadlineAt);
            const [buffer, setBuffer] = useState(initial.buffer);
            const [tasks, setTasks] = useState(initial.tasks);
            const [alertEpoch, setAlertEpoch] = useState(initial.alertEpoch);
            const [alertsOn, setAlertsOn] = useState(initial.alertsOn);
            const [soundOn, setSoundOn] = useState(initial.soundOn);
            const [keepAwake, setKeepAwake] = useState(initial.keepAwake);
            const [hour12, setHour12] = useState(initial.hour12);
            const [templates, setTemplates] = useState(loadTemplates);
            const [nowMs, setNowMs] = useState(Date.now());
            const [dragId, setDragId] = useState(null);
            const [toast, setToast] = useState(initial.rolledOver ? ROLLOVER_TOAST : null);
            const [undo, setUndo] = useState(null);
            const [confirmReset, setConfirmReset] = useState(false);
            const [panelOpen, setPanelOpen] = useState(false);
            const [plansOpen, setPlansOpen] = useState(false);
            const [notif, setNotif] = useState(notifState());
            const [focusId, setFocusId] = useState(null);
            // Finished steps fold to one line; these are the ones opened back up for editing. Not saved:
            // a reload folds them again.
            const [openDone, setOpenDone] = useState(() => new Set());
            const setDoneOpen = (id, open) => setOpenDone(s => {
                const next = new Set(s);
                if (open) next.add(String(id)); else next.delete(String(id));
                return next;
            });
            const firedAlerts = useRef(loadFired());
            const headerRight = useRef(null);
            const importInput = useRef(null);
            const wakeLock = useRef(null);

            use12h = hour12;
            soundWanted = soundOn;

            // Any change that moves the gates starts a new alert epoch: alerts timed before it are skipped,
            // so tapping Start or editing a duration while behind doesn't set off a pile of stale alerts.
            const touch = () => { const t = Date.now(); setAlertEpoch(t); setNowMs(t); };

            // --- Persistence + sync between tabs ---
            useEffect(() => {
                const json = JSON.stringify({ v: 4, deadlineAt, buffer, tasks, alertEpoch, alertsOn, soundOn, keepAwake, hour12 });
                try { if (localStorage.getItem(STORAGE_KEY) !== json) localStorage.setItem(STORAGE_KEY, json); } catch (e) {}
            }, [deadlineAt, buffer, tasks, alertEpoch, alertsOn, soundOn, keepAwake, hour12]);

            useEffect(() => {
                const json = JSON.stringify(templates);
                try { if (localStorage.getItem(TEMPLATES_KEY) !== json) localStorage.setItem(TEMPLATES_KEY, json); } catch (e) {}
            }, [templates]);

            useEffect(() => {
                const onStorage = (e) => {
                    if (e.storageArea !== localStorage) return;
                    if (e.key === STORAGE_KEY && e.newValue) {
                        try {
                            const s = normalizeSaved(JSON.parse(e.newValue), Date.now());
                            setDeadlineAt(s.deadlineAt); setBuffer(s.buffer); setTasks(s.tasks); setAlertEpoch(s.alertEpoch);
                            setAlertsOn(s.alertsOn); setSoundOn(s.soundOn); setKeepAwake(s.keepAwake); setHour12(s.hour12);
                        } catch (err) {}
                    } else if (e.key === ALERTS_KEY) {
                        loadFired().forEach(k => firedAlerts.current.add(k));
                    } else if (e.key === TEMPLATES_KEY) {
                        setTemplates(loadTemplates());
                    }
                };
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);
            }, []);

            // --- Clock ---
            useEffect(() => {
                const tick = () => { setNowMs(Date.now()); setNotif(notifState()); };
                const interval = setInterval(() => setNowMs(Date.now()), 1000);
                document.addEventListener('visibilitychange', tick);
                window.addEventListener('focus', tick);
                return () => {
                    clearInterval(interval);
                    document.removeEventListener('visibilitychange', tick);
                    window.removeEventListener('focus', tick);
                };
            }, []);

            // New day while the app stayed open: same treatment as on load.
            useEffect(() => {
                if (!isStale(deadlineAt, nowMs)) return;
                const hadProgress = tasks.some(t => t.status !== 'pending' || t.spentMs);
                setDeadlineAt(resolveDeadline(toTimeInput(deadlineAt), nowMs));
                if (hadProgress) {
                    setTasks(ts => ts.map(freshTask));
                    setToast(ROLLOVER_TOAST);
                }
                setUndo(null);
                touch();
            }, [nowMs, deadlineAt]);

            // --- Plan: work backwards from (deadline - buffer) over the work that's left ---
            // Remaining steps are scheduled back-to-back: the running step first, then pending steps in list
            // order. Each gets the latest start/end that still lands the whole plan on time. With steps done in
            // order this matches the original plan; out of order, it stays correct.
            const finishGate = deadlineAt - buffer * MIN;
            const activeTask = tasks.find(t => t.status === 'active');
            const pendingTasks = tasks.filter(t => t.status === 'pending');
            const latest = new Map();
            {
                let g = finishGate;
                const remaining = [activeTask, ...pendingTasks].filter(Boolean);
                for (let i = remaining.length - 1; i >= 0; i--) {
                    const end = g;
                    g -= remainingMs(remaining[i]);
                    latest.set(String(remaining[i].id), { start: g, end });
                }
            }
            const latestOf = (t) => latest.get(String(t.id));

            // --- Projection: work forwards from now ---
            const nextTask = activeTask || pendingTasks[0];
            const isEmpty = tasks.length === 0;
            const allDone = !isEmpty && !nextTask;
            const hasProgress = tasks.some(t => t.status !== 'pending' || t.spentMs > 0);
            const activeProjectedEnd = activeTask ? Math.max(nowMs, activeTask.startedAt + remainingMs(activeTask)) : null;

            let projectedFinish = null;
            if (nextTask) {
                projectedFinish = (activeTask ? activeProjectedEnd : nowMs) + pendingTasks.reduce((s, t) => s + remainingMs(t), 0);
            } else {
                const finishes = tasks.map(t => t.completedAt).filter(Number.isFinite);
                if (finishes.length) projectedFinish = Math.max(...finishes);
            }

            const bufferLeft = projectedFinish == null ? buffer : toMins(deadlineAt - projectedFinish);
            const vsPlan = projectedFinish == null ? 0 : toMins(finishGate - projectedFinish); // positive = ahead
            const tone = isEmpty ? 'neutral' : bufferLeft < 0 ? 'red' : (nextTask && vsPlan < 0) ? 'yellow' : 'green';
            // Show how much of the safety buffer is intact; time beyond it is reported as "ahead of plan".
            const bufferShown = bufferLeft < 0 ? bufferLeft : Math.min(bufferLeft, buffer);
            const bufferClass = bufferLeft < 0 ? ' neg' : bufferLeft >= buffer ? ' pos' : ' partial';

            // The gate you're working towards right now, and how long until it.
            const gateAt = activeTask ? latestOf(activeTask).end : nextTask ? latestOf(nextTask).start : null;
            const gateDiff = gateAt == null ? 0 : gateAt - nowMs;
            let countdown = '', countdownClass = '';
            if (nextTask) {
                if (gateDiff > 0) {
                    const left = Math.ceil(gateDiff / MIN);
                    countdown = activeTask ? `${fmtDur(left)} left` : `in ${fmtDur(left)}`;
                    if (left <= 5) countdownClass = ' soon';
                } else {
                    const over = Math.floor(-gateDiff / MIN);
                    if (over === 0) { countdown = 'now'; countdownClass = ' soon'; }
                    else { countdown = `${fmtDur(over)} ${activeTask ? 'over' : 'overdue'}`; countdownClass = ' over'; }
                }
            }

            const totalMins = tasks.reduce((s, t) => s + t.duration, 0);
            const planLine = isEmpty ? 'Add steps to build the plan'
                : !hasProgress ? `${fmtDur(totalMins)} of steps · start by ${fmtWhen(finishGate - totalMins * MIN, nowMs)}`
                : allDone ? `${fmtDur(totalMins)} planned`
                : `${fmtDur(totalMins)} planned · ${fmtDur(Math.ceil((projectedFinish - nowMs) / MIN))} left`;

            // --- Alerts: 5 minutes before and at the current gate, plus once when the deadline is projected to slip ---
            const alerts = [];
            if (activeTask) {
                const name = stepName(activeTask);
                const k = `${activeTask.id}-${gateAt}-${alertEpoch}`;
                alerts.push({ key: `warn-end-${k}`, at: gateAt - 5 * MIN, title: `5 min left: ${name}`, body: `Finish by ${fmtWhen(gateAt, nowMs)} to stay on plan.` });
                alerts.push({ key: `end-${k}`, at: gateAt, title: `Time's up: ${name}`, body: `This step was due to finish at ${fmtWhen(gateAt, nowMs)}.` });
            } else if (nextTask) {
                const name = stepName(nextTask);
                const k = `${nextTask.id}-${gateAt}-${alertEpoch}`;
                alerts.push({ key: `warn-start-${k}`, at: gateAt - 5 * MIN, title: `Up next in 5 min: ${name}`, body: `Start by ${fmtWhen(gateAt, nowMs)} to stay on plan.` });
                alerts.push({ key: `start-${k}`, at: gateAt, title: `Start now: ${name}`, body: `This step was due to start at ${fmtWhen(gateAt, nowMs)}.` });
            }
            if (nextTask && bufferLeft < 0) {
                alerts.push({ key: `late-${deadlineAt}`, at: nowMs, always: true, title: `Deadline at risk`, body: `On current pace you'll finish at ${fmtWhen(projectedFinish, nowMs)}, ${fmtDur(bufferLeft)} past the deadline.` });
            }

            useEffect(() => {
                if (!alertsOn) return;
                // Skip anything more than 10 minutes stale (e.g. the tab was asleep) rather than firing a backlog.
                const isDue = (a) => a.at <= nowMs && a.at > nowMs - 10 * MIN && (a.always || a.at >= alertEpoch) && !firedAlerts.current.has(a.key);
                if (!alerts.some(isDue)) return;
                // Re-check against what other tabs have already fired before alerting.
                loadFired().forEach(k => firedAlerts.current.add(k));
                const due = alerts.filter(isDue);
                if (!due.length) return;
                due.forEach(a => firedAlerts.current.add(a.key));
                saveFired(firedAlerts.current);
                const latestAlert = due[due.length - 1];
                fireAlert(latestAlert, soundOn);
                setToast({ kind: 'alert', title: latestAlert.title, body: latestAlert.body });
            });

            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(null), toast.kind === 'alert' ? 15000 : 8000);
                return () => clearTimeout(t);
            }, [toast]);

            useEffect(() => {
                if (!undo) return;
                const t = setTimeout(() => setUndo(null), 6000);
                return () => clearTimeout(t);
            }, [undo]);

            useEffect(() => {
                if (!confirmReset) return;
                const t = setTimeout(() => setConfirmReset(false), 3000);
                return () => clearTimeout(t);
            }, [confirmReset]);

            // Keep the screen on while a step runs and alerts are on: a phone that sleeps pauses the app,
            // and a paused app can't alert. The lock drops whenever the page is hidden, so re-request it.
            const wantLock = alertsOn && keepAwake && !!activeTask;
            useEffect(() => {
                if (!wantLock || !('wakeLock' in navigator)) return;
                let cancelled = false;
                const acquire = async () => {
                    if (cancelled || wakeLock.current || document.visibilityState !== 'visible') return;
                    try {
                        const lock = await navigator.wakeLock.request('screen');
                        if (cancelled) { lock.release().catch(() => {}); return; }
                        wakeLock.current = lock;
                        lock.addEventListener('release', () => { if (wakeLock.current === lock) wakeLock.current = null; });
                    } catch (e) {}
                };
                acquire();
                document.addEventListener('visibilitychange', acquire);
                return () => {
                    cancelled = true;
                    document.removeEventListener('visibilitychange', acquire);
                    if (wakeLock.current) { wakeLock.current.release().catch(() => {}); wakeLock.current = null; }
                };
            }, [wantLock]);

            // Close the alerts panel on an outside tap or Escape.
            useEffect(() => {
                if (!panelOpen) return;
                setNotif(notifState());
                const onDown = (e) => { if (headerRight.current && !headerRight.current.contains(e.target)) setPanelOpen(false); };
                const onKey = (e) => { if (e.key === 'Escape') setPanelOpen(false); };
                document.addEventListener('pointerdown', onDown);
                document.addEventListener('keydown', onKey);
                return () => { document.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey); };
            }, [panelOpen]);

            // Focus the name field of a step that was just added.
            useEffect(() => {
                if (focusId == null) return;
                const sel = `[data-task-id="${window.CSS && CSS.escape ? CSS.escape(String(focusId)) : focusId}"] .task-name`;
                const el = document.querySelector(sel);
                if (el) el.focus();
                setFocusId(null);
            }, [focusId]);

            // Status in the tab title, e.g. "12m left · Drafting · ▲ 5m ahead".
            useEffect(() => {
                if (isEmpty) { document.title = 'Deadline Planner'; return; }
                if (allDone) { document.title = bufferLeft < 0 ? '✗ Finished late · Deadline Planner' : '✓ Done · Deadline Planner'; return; }
                let status;
                if (tone === 'red') status = `✗ late ${fmtDur(bufferLeft)}`;
                else if (tone === 'yellow') status = `▼ ${fmtDur(vsPlan)} behind`;
                else status = activeTask && vsPlan > 0 ? `▲ ${fmtDur(vsPlan)} ahead` : '✓ on track';
                document.title = `${countdown} · ${stepName(nextTask)} · ${status}`;
            });

            // --- Actions: settings ---
            const toggleAlerts = async () => {
                if (alertsOn) return setAlertsOn(false);
                if (notifState() === 'default') {
                    try { await Notification.requestPermission(); } catch (e) {}
                }
                const st = notifState();
                setNotif(st);
                setAlertsOn(true);
                setToast(st === 'granted'
                    ? { kind: 'info', title: 'Alerts on', body: "Keep this app open. Phones pause web apps in the background, so alerts only fire while it's running." }
                    : { kind: 'info', title: 'Alerts on (in-app only)', body: st === 'denied'
                        ? 'Notifications are blocked for this site, so alerts show here only. Turn on Sound to hear them.'
                        : "This browser can't show notifications here (on iPhone, add the app to your Home Screen first). Alerts show in-app; turn on Sound to hear them." });
            };
            const toggleSound = () => {
                if (soundOn) return setSoundOn(false);
                unlockAudio();
                setSoundOn(true);
                setTimeout(beep, 50); // test beep, and confirms audio is unlocked
            };

            const onDeadlineInput = (v) => {
                if (!/^\d{2}:\d{2}/.test(v)) return;
                setDeadlineAt(resolveDeadline(v.slice(0, 5), Date.now()));
                touch();
            };
            const onBufferInput = (v) => {
                const n = parseInt(v, 10);
                if (!Number.isFinite(n)) return;
                setBuffer(clampMins(n));
                touch();
            };

            // First tap arms, second tap (within 3s) clears all progress and re-anchors the deadline.
            const resetProgress = () => {
                if (!confirmReset) return setConfirmReset(true);
                setTasks(tasks.map(freshTask));
                setDeadlineAt(resolveDeadline(toTimeInput(deadlineAt), Date.now()));
                firedAlerts.current.clear();
                saveFired(firedAlerts.current);
                setConfirmReset(false);
                touch();
            };

            // --- Actions: steps ---
            const addTask = () => {
                const id = uid();
                setTasks([...tasks, { id, name: '', duration: 15, status: 'pending' }]);
                setFocusId(id);
                touch();
            };
            const patchTask = (id, patch) => setTasks(ts => ts.map(t => sameId(t.id, id) ? { ...t, ...patch } : t));
            const onDurationInput = (id, v) => {
                const n = parseInt(v, 10);
                if (!Number.isFinite(n)) return;
                patchTask(id, { duration: clampMins(n) });
                touch();
            };

            const deleteTask = (id) => {
                const index = tasks.findIndex(t => sameId(t.id, id));
                if (index < 0) return;
                const task = tasks[index];
                setTasks(tasks.filter((_, i) => i !== index));
                setUndo({ kind: 'delete', label: `Deleted “${stepName(task)}”`, task, index });
                touch();
            };
            const doUndo = () => {
                if (!undo) return;
                if (undo.kind === 'delete') {
                    setTasks(ts => {
                        let task = undo.task;
                        // Don't end up with two running steps.
                        if (task.status === 'active' && ts.some(t => t.status === 'active')) task = pauseOf(task, Date.now());
                        const copy = [...ts];
                        copy.splice(Math.min(undo.index, copy.length), 0, task);
                        return copy;
                    });
                } else {
                    setTasks(undo.tasks); setDeadlineAt(undo.deadlineAt); setBuffer(undo.buffer);
                }
                setUndo(null);
                touch();
            };

            const moveTask = (index, direction) => {
                const to = index + direction;
                if (to < 0 || to >= tasks.length) return;
                const copy = [...tasks];
                [copy[index], copy[to]] = [copy[to], copy[index]];
                setTasks(copy);
                touch();
            };

            const startTask = (id) => {
                const now = Date.now();
                // Only one step can run; starting another pauses the current one (its time is kept).
                setTasks(ts => ts.map(t => {
                    if (sameId(t.id, id)) return { ...t, status: 'active', startedAt: now, firstStartedAt: t.firstStartedAt ?? now };
                    if (t.status === 'active') return pauseOf(t, now);
                    return t;
                }));
                touch();
            };
            const pauseTask = (id) => {
                const now = Date.now();
                setTasks(ts => ts.map(t => sameId(t.id, id) && t.status === 'active' ? pauseOf(t, now) : t));
                touch();
            };
            // Works on a running step or straight from pending (e.g. it was already done, or skipped).
            const completeTask = (id) => {
                const now = Date.now();
                const due = latest.get(String(id))?.end ?? now;
                setTasks(ts => ts.map(t => {
                    if (!sameId(t.id, id)) return t;
                    const { startedAt, spentMs, ...rest } = t;
                    const ran = t.status === 'active' && startedAt ? Math.max(0, now - startedAt) : 0;
                    const timed = t.status === 'active' || spentMs > 0;
                    const done = { ...rest, status: 'completed', completedAt: now, dueBy: due };
                    if (timed) done.actualMs = (spentMs || 0) + ran;
                    return done;
                }));
                setDoneOpen(id, false);
                touch();
            };
            const reopenTask = (id) => {
                setTasks(ts => ts.map(t => sameId(t.id, id) ? freshTask(t) : t));
                touch();
            };

            // Pointer-based reordering from the grip handle (works with touch as well as mouse).
            const onGripDown = (e, id) => {
                e.preventDefault();
                e.currentTarget.setPointerCapture(e.pointerId);
                setDragId(id);
            };
            const onGripMove = (e) => {
                if (dragId === null) return;
                const row = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-task-id]');
                if (!row || row.dataset.taskId === String(dragId)) return;
                setTasks(prev => {
                    const from = prev.findIndex(t => sameId(t.id, dragId));
                    const to = prev.findIndex(t => sameId(t.id, row.dataset.taskId));
                    if (from < 0 || to < 0) return prev;
                    const copy = [...prev];
                    copy.splice(to, 0, copy.splice(from, 1)[0]);
                    return copy;
                });
            };
            const onGripUp = () => {
                if (dragId !== null) touch();
                setDragId(null);
            };

            // --- Actions: templates, export, import ---
            const applyPlan = (tpl, label) => {
                setUndo({ kind: 'snapshot', label, tasks, deadlineAt, buffer });
                setTasks(tpl.steps.map(s => ({ id: uid(), name: s.name, duration: s.duration, status: 'pending' })));
                setBuffer(tpl.buffer);
                if (tpl.deadline) setDeadlineAt(resolveDeadline(tpl.deadline, Date.now()));
                setPlansOpen(false);
                touch();
            };
            const saveTemplate = () => {
                const name = window.prompt('Name this template:', '');
                if (name == null) return;
                const tpl = sanitizeTemplate({
                    id: uid(), name, deadline: toTimeInput(deadlineAt), buffer,
                    steps: tasks.map(t => ({ name: t.name, duration: t.duration }))
                });
                // Saving under an existing name replaces that template.
                setTemplates(list => [...list.filter(t => t.name !== tpl.name), tpl]);
                setToast({ kind: 'info', title: 'Template saved', body: `“${tpl.name}” · ${tpl.steps.length} steps, due ${fmtClockStr(tpl.deadline)}, ${tpl.buffer}m buffer.` });
            };
            const deleteTemplate = (tpl) => {
                if (!window.confirm(`Delete template “${tpl.name}”?`)) return;
                setTemplates(list => list.filter(t => t.id !== tpl.id));
            };
            const exportJSON = () => {
                const data = {
                    app: 'deadline-planner', version: 1, exportedAt: new Date().toISOString(),
                    plan: { deadline: toTimeInput(deadlineAt), buffer, steps: tasks.map(t => ({ name: t.name, duration: t.duration })) },
                    templates
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                a.href = url;
                a.download = `deadline-planner-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            const onImportFile = async (e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    const incoming = Array.isArray(data.templates) ? data.templates.map(sanitizeTemplate).filter(Boolean) : [];
                    const plan = data.plan ? sanitizeTemplate({ name: 'Imported plan', ...data.plan }) : null;
                    if (!plan && !incoming.length) throw new Error('nothing to import');
                    if (incoming.length) {
                        const names = new Set(incoming.map(t => t.name));
                        setTemplates(list => [...list.filter(t => !names.has(t.name)), ...incoming.map(t => ({ ...t, id: uid() }))]);
                    }
                    if (plan) applyPlan(plan, 'Imported plan');
                    const parts = [];
                    if (plan) parts.push(`plan with ${plan.steps.length} steps`);
                    if (incoming.length) parts.push(`${incoming.length} template${incoming.length === 1 ? '' : 's'}`);
                    setToast({ kind: 'info', title: 'Imported', body: `Loaded ${parts.join(' and ')}.` });
                } catch (err) {
                    setToast({ kind: 'info', title: 'Import failed', body: "That file isn't a Deadline Planner export." });
                }
            };

            // --- Render ---
            const deadlineDay = dayLabel(deadlineAt, nowMs);
            const clock = timeParts(nowMs);
            const bellPartial = alertsOn && notif !== 'granted';
            const notifSub = notif === 'granted' ? 'Notifications allowed'
                : notif === 'denied' ? 'Notifications blocked: in-app only'
                : notif === 'unsupported' ? 'No notifications here: in-app only'
                : 'Notifications not yet allowed';
            const wakeSupported = 'wakeLock' in navigator;

            let statusIcon, statusText, statusSub = null;
            if (isEmpty) { statusIcon = 'Clock'; statusText = 'No steps yet'; }
            else if (allDone) {
                if (bufferLeft < 0) { statusIcon = 'AlertTriangle'; statusText = `Finished ${fmtDur(bufferLeft)} late`; }
                else { statusIcon = 'PartyPopper'; statusText = 'All done'; if (projectedFinish != null) statusSub = { cls: 'ahead', text: `${fmtDur(bufferLeft)} before deadline` }; }
            }
            else if (tone === 'red') { statusIcon = 'AlertTriangle'; statusText = `Late ${fmtDur(bufferLeft)}`; }
            else if (tone === 'yellow') { statusIcon = 'AlertTriangle'; statusText = `Behind ${fmtDur(vsPlan)}`; statusSub = { cls: 'behind', text: 'eating into buffer' }; }
            else {
                statusIcon = 'CheckCircle';
                statusText = hasProgress ? 'On track' : 'Ready';
                if (activeTask && vsPlan > 0) statusSub = { cls: 'ahead', text: `${fmtDur(vsPlan)} ahead of plan` };
            }

            // End-of-run summary: actual vs estimate per step.
            const summaryRows = allDone ? tasks.map(t => ({
                id: t.id, name: stepName(t), est: t.duration,
                actual: Number.isFinite(t.actualMs) ? toMins(t.actualMs) : null
            })) : [];
            const timedRows = summaryRows.filter(r => r.actual != null);
            const estTotal = summaryRows.reduce((s, r) => s + r.est, 0);
            const actualTotal = timedRows.reduce((s, r) => s + r.actual, 0);
            const timedEst = timedRows.reduce((s, r) => s + r.est, 0);
            const diffClass = (d) => d > 0 ? 'over-est' : d < 0 ? 'under-est' : '';

            return html`<div>
                <header class="top">
                    <div class="brand"><a href="/">zbCAD</a><span class="sep">/</span><span>Deadline<span class="long"> Planner</span></span></div>
                    <div class="header-right" ref=${headerRight}>
                        <button
                            class=${'bell' + (alertsOn ? ' on' : '') + (bellPartial ? ' partial' : '')}
                            onClick=${() => setPanelOpen(!panelOpen)}
                            title=${!alertsOn ? 'Alerts off' : bellPartial ? 'Alerts on (in-app only)' : 'Alerts on'}
                            aria-label="Alerts and display settings"
                            aria-haspopup="dialog"
                            aria-expanded=${panelOpen ? 'true' : 'false'}
                        >
                            <${Icon} name=${alertsOn ? 'Bell' : 'BellOff'} size=${18} />
                        </button>
                        <div class="clock-time mono" title="Current time">${clock.hm}${clock.suffix && html`<span class="ampm">${clock.suffix}</span>`}</div>
                        ${panelOpen && html`
                            <div class="panel card" role="dialog" aria-label="Alerts and display">
                                <${Switch} on=${alertsOn} onToggle=${toggleAlerts} label="Alerts"
                                    sub=${alertsOn ? notifSub : '5 min before and at each gate'} subClass=${alertsOn && notif !== 'granted' ? 'warn' : ''} />
                                <${Switch} on=${soundOn} onToggle=${toggleSound} label="Sound" sub="Beep when an alert fires" />
                                <${Switch} on=${keepAwake && wakeSupported} onToggle=${() => setKeepAwake(!keepAwake)} disabled=${!wakeSupported}
                                    label="Keep screen awake" sub=${wakeSupported ? 'While a step runs and alerts are on' : 'Not supported in this browser'} />
                                <${Switch} on=${!hour12} onToggle=${() => setHour12(!hour12)} label="24-hour time" />
                                <div class="panel-note">Phones pause web apps in the background, so alerts only fire while this app is open.</div>
                            </div>
                        `}
                    </div>
                </header>

                <div class="app">
                    ${toast && html`
                        <div class=${'toast card' + (toast.kind === 'info' ? ' info' : '')} role=${toast.kind === 'alert' ? 'alert' : 'status'} onClick=${() => setToast(null)}>
                            <${Icon} name=${toast.kind === 'info' ? 'Info' : 'Bell'} size=${18} />
                            <div class="toast-text">
                                <div class="toast-title">${toast.title}</div>
                                <div class="toast-body">${toast.body}</div>
                            </div>
                            <button class="toast-close" aria-label="Dismiss" onClick=${(e) => { e.stopPropagation(); setToast(null); }}>
                                <${Icon} name="X" size=${16} />
                            </button>
                        </div>
                    `}


                    <div class="settings card">
                        <div class="grow">
                            <label class="label" for="deadline">
                                Deadline ${deadlineDay && html`<span class="day">(${deadlineDay})</span>`}
                            </label>
                            <${DraftInput} id="deadline" type="time" class="input mono" value=${toTimeInput(deadlineAt)} onValue=${onDeadlineInput} />
                        </div>
                        <div class="buffer">
                            <label class="label" for="buffer">Buffer, min</label>
                            <${DraftInput} id="buffer" type="number" min="0" step="1" inputmode="numeric" class="input mono" value=${buffer} onValue=${onBufferInput} />
                        </div>
                        <div class="plan-line">${planLine}</div>
                    </div>

                    <section class=${`status card tone-${tone}${allDone ? ' all-done' : ''}`} aria-label="Status">
                        <div>
                            <div class="eyebrow">Status</div>
                            <div class="status-line"><${Icon} name=${statusIcon} size=${18} /> ${statusText}</div>
                            ${statusSub && html`<div class=${'status-sub ' + statusSub.cls}>${statusSub.text}</div>`}
                        </div>
                        <div class="right">
                            <div class="eyebrow">Buffer left</div>
                            <div class=${'buffer-left mono' + (isEmpty ? '' : bufferClass)}>
                                ${bufferShown < 0 ? '−' : ''}${fmtDur(bufferShown)}
                            </div>
                            ${allDone && projectedFinish != null && html`<div class="finished">finished ${fmtWhen(projectedFinish, nowMs)}</div>`}
                        </div>
                        ${nextTask && html`
                            <div class="gate-row">
                                <div>
                                    <div class="eyebrow">${activeTask ? 'Finish current step by' : 'Start next step by'}</div>
                                    <div class="gate">
                                        <span class="gate-time mono">${fmtWhen(gateAt, nowMs)}</span>
                                        <span class=${'countdown' + countdownClass}>${countdown}</span>
                                    </div>
                                </div>
                                <div class="right">
                                    <div class="eyebrow">Est. finish</div>
                                    <div class="eta mono">${fmtWhen(projectedFinish, nowMs)}</div>
                                </div>
                            </div>
                        `}
                    </section>

                    ${allDone && html`
                        <section class="summary card" aria-label="Run summary">
                            <div class="eyebrow">Run summary</div>
                            <div class="sum-row sum-head"><span>Step</span><span>Est</span><span>Actual</span><span>±</span></div>
                            ${summaryRows.map(r => html`
                                <div class="sum-row" key=${r.id}>
                                    <span class="sum-name">${r.name}</span>
                                    <span class="mono">${fmtDur(r.est)}</span>
                                    <span class="mono">${r.actual == null ? '—' : fmtDur(r.actual)}</span>
                                    <span class=${'mono ' + (r.actual == null ? '' : diffClass(r.actual - r.est))}>${r.actual == null ? '' : fmtSigned(r.actual - r.est)}</span>
                                </div>
                            `)}
                            <div class="sum-row sum-total">
                                <span>Total</span>
                                <span class="mono">${fmtDur(estTotal)}</span>
                                <span class="mono">${timedRows.length ? fmtDur(actualTotal) : '—'}</span>
                                <span class=${'mono ' + diffClass(actualTotal - timedEst)}>${timedRows.length ? fmtSigned(actualTotal - timedEst) : ''}</span>
                            </div>
                            ${timedRows.length < summaryRows.length && html`<p class="muted">— marked done without timing; left out of the actual and ± totals.</p>`}
                        </section>
                    `}

                    <div class="steps-head">
                        <h2 class="label">Steps</h2>
                        ${hasProgress && html`
                            <button class=${'reset' + (confirmReset ? ' armed' : '')} onClick=${resetProgress}>
                                <${Icon} name="RotateCcw" size=${12} /> ${confirmReset ? 'Tap again to reset' : 'Reset all'}
                            </button>
                        `}
                    </div>

                    <div class="task-list">
                        ${isEmpty && html`<div class="empty">No steps yet. Add one below to build the plan.</div>`}
                        ${tasks.map((task, index) => {
                            const isCompleted = task.status === 'completed';
                            const isActive = task.status === 'active';
                            const isPaused = task.status === 'pending' && task.spentMs > 0;
                            const name = stepName(task);
                            const lt = latestOf(task);
                            const cls = 'task card' + (isActive ? ' active' : '') + (isCompleted ? ' done' : '') + (isPaused ? ' paused' : '') + (sameId(dragId, task.id) ? ' dragging' : '');

                            // Left/right: when it started or must start, and when it ended or must end.
                            // Middle chip: how this step is tracking against its own gate.
                            let left, right, chip = null;
                            if (isCompleted) {
                                left = task.firstStartedAt ? `started ${fmtWhen(task.firstStartedAt, nowMs)}` : 'marked done';
                                right = task.completedAt ? `done ${fmtWhen(task.completedAt, nowMs)}` : 'done';
                                if (Number.isFinite(task.completedAt) && Number.isFinite(task.dueBy)) {
                                    const diff = toMins(task.dueBy - task.completedAt);
                                    chip = { text: earlyLate(diff), cls: diff >= 0 ? 'chip-ok' : 'chip-late' };
                                }
                            } else if (isActive) {
                                left = `started ${fmtWhen(task.firstStartedAt ?? task.startedAt, nowMs)}`;
                                right = `end by ${fmtWhen(lt.end, nowMs)}`;
                                const diff = toMins(lt.end - activeProjectedEnd);
                                chip = { text: `ends ${fmtWhen(activeProjectedEnd, nowMs)} · ${earlyLate(diff)}`, cls: (diff >= 0 ? 'chip-ok' : 'chip-late') + ' wide' };
                            } else {
                                left = `${isPaused ? 'resume' : 'start'} by ${fmtWhen(lt.start, nowMs)}`;
                                right = `end by ${fmtWhen(lt.end, nowMs)}`;
                                if (isPaused) chip = { text: `paused · ${fmtDur(toMins(task.spentMs))} in`, cls: 'chip-paused' };
                            }

                            if (isCompleted && !openDone.has(String(task.id))) return html`
                                <div key=${task.id} data-task-id=${task.id} class="task card done folded">
                                    <button class="fold-row" onClick=${() => setDoneOpen(task.id, true)}
                                        aria-expanded="false" aria-label=${`${name}, ${right}. Show details`}>
                                        <${Icon} name="Check" size=${14} className="fold-check" />
                                        <span class="fold-name">${name}</span>
                                        ${chip && html`<span class=${'mono fold-chip ' + chip.cls}>${chip.text}</span>`}
                                        <span class="mono fold-when">${right}</span>
                                    </button>
                                    <button class="icon-btn" onClick=${() => reopenTask(task.id)} aria-label=${`Reopen ${name}`} title="Reopen"><${Icon} name="RotateCcw" size=${14} /></button>
                                </div>
                            `;

                            return html`
                                <div key=${task.id} data-task-id=${task.id} class=${cls}>
                                    <div class="task-times mono">
                                        <span class="planned">${left}</span>
                                        ${chip && html`<span class=${chip.cls}>${chip.text}</span>`}
                                        <span class="planned">${right}</span>
                                    </div>
                                    <div class="task-main">
                                        <div
                                            class="grip"
                                            aria-hidden="true"
                                            onPointerDown=${(e) => onGripDown(e, task.id)}
                                            onPointerMove=${onGripMove}
                                            onPointerUp=${onGripUp}
                                            onPointerCancel=${onGripUp}
                                        >
                                            <${Icon} name="GripVertical" size=${16} />
                                        </div>
                                        <input type="text" class=${'input task-name' + (isCompleted ? ' struck' : '')} value=${task.name}
                                            placeholder="Step name" aria-label="Step name"
                                            onInput=${(e) => patchTask(task.id, { name: e.target.value })} />
                                        <div class="dur">
                                            <${DraftInput} type="number" min="0" step="1" inputmode="numeric" class="input" value=${task.duration}
                                                aria-label=${`Minutes for ${name}`} onValue=${(v) => onDurationInput(task.id, v)} />
                                            <span aria-hidden="true">min</span>
                                        </div>
                                    </div>
                                    <div class="task-actions">
                                        <div class="tools">
                                            <button class="icon-btn" onClick=${() => moveTask(index, -1)} aria-label=${`Move ${name} up`}><${Icon} name="ArrowUp" size=${14} /></button>
                                            <button class="icon-btn" onClick=${() => moveTask(index, 1)} aria-label=${`Move ${name} down`}><${Icon} name="ArrowDown" size=${14} /></button>
                                            <button class="icon-btn danger" onClick=${() => deleteTask(task.id)} aria-label=${`Delete ${name}`}><${Icon} name="Trash2" size=${14} /></button>
                                        </div>
                                        <div class="act-group">
                                            ${task.status === 'pending' && html`
                                                <button class="icon-btn ok" onClick=${() => completeTask(task.id)} aria-label=${`Mark ${name} done`} title="Mark done"><${Icon} name="Check" size=${14} /></button>
                                                <button class="act start" onClick=${() => startTask(task.id)}><${Icon} name="Play" size=${12} /> ${isPaused ? 'Resume' : 'Start'}</button>
                                            `}
                                            ${isActive && html`
                                                <button class="act pause" onClick=${() => pauseTask(task.id)}><${Icon} name="Pause" size=${12} /> Pause</button>
                                                <button class="act finish" onClick=${() => completeTask(task.id)}><${Icon} name="Check" size=${12} /> Done</button>
                                            `}
                                            ${isCompleted && html`<button class="icon-btn" onClick=${() => setDoneOpen(task.id, false)} aria-label=${`Fold ${name}`} title="Fold to one line"><${Icon} name="ChevronDown" size=${14} className="fold-up" /></button>`}
                                            ${isCompleted && html`<button class="act restart" onClick=${() => reopenTask(task.id)}><${Icon} name="RotateCcw" size=${12} /> Reopen</button>`}
                                        </div>
                                    </div>
                                </div>
                            `;
                        })}
                    </div>
                    <button class="add" onClick=${addTask}>
                        <${Icon} name="Plus" size=${18} /> Add step
                    </button>

                    <section class="plans card">
                        <button class="plans-head" aria-expanded=${plansOpen ? 'true' : 'false'} onClick=${() => setPlansOpen(!plansOpen)}>
                            <${Icon} name="Bookmark" size=${16} /> Templates & backup
                            <${Icon} name="ChevronDown" size=${16} className="chev" />
                        </button>
                        ${plansOpen && html`
                            <div class="plans-body">
                                ${templates.length ? html`
                                    <ul class="tpl-list">
                                        ${templates.map(t => html`
                                            <li class="tpl" key=${t.id}>
                                                <div class="tpl-info">
                                                    <div class="tpl-name">${t.name}</div>
                                                    <div class="tpl-meta">${t.steps.length} steps · ${fmtDur(t.steps.reduce((s, x) => s + x.duration, 0))}${t.deadline ? ` · due ${fmtClockStr(t.deadline)}` : ''}</div>
                                                </div>
                                                <button class="act start" onClick=${() => applyPlan(t, `Loaded “${t.name}”`)}>Load</button>
                                                <button class="icon-btn danger" onClick=${() => deleteTemplate(t)} aria-label=${`Delete template ${t.name}`}><${Icon} name="Trash2" size=${14} /></button>
                                            </li>
                                        `)}
                                    </ul>
                                ` : html`<p class="muted">No templates yet. Save the current steps, deadline and buffer to reuse them.</p>`}
                                <div class="plans-actions">
                                    <button class="act restart" onClick=${saveTemplate}><${Icon} name="Bookmark" size=${12} /> Save current</button>
                                    <button class="act restart" onClick=${exportJSON}><${Icon} name="Download" size=${12} /> Export</button>
                                    <button class="act restart" onClick=${() => importInput.current && importInput.current.click()}><${Icon} name="Upload" size=${12} /> Import</button>
                                    <input type="file" accept="application/json,.json" hidden ref=${importInput} onChange=${onImportFile} />
                                </div>
                            </div>
                        `}
                    </section>

                    <div class="foot">Changes are saved on this device.</div>

                    ${undo && html`
                        <div class="snackbar" role="status">
                            <span>${undo.label}</span>
                            <button class="snack-btn" onClick=${doUndo}>Undo</button>
                        </div>
                    `}
                </div>
            </div>`;
        };

        render(html`<${App} />`, document.getElementById('root'));
    </script>
</body>
</html>
