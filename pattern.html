<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet Metal Layout</title>
<meta name="description" content="Flat pattern development for sheet metal fittings: rectangle to round, transitions, cones, offset reducers, elbows and branches. Export DXF and SVG.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d9480f' stroke-width='2.2' stroke-linecap='round'%3E%3Cellipse cx='12' cy='6' rx='5' ry='2'/%3E%3Cpath d='M3 19h18M7 6L3 19M17 6l4 13'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1c2228; --muted:#6a737d; --line:#dcd8cf; --soft:#ece9e2;
  --accent:#d9480f; --accent-ink:#fff; --cut:#1c2228; --bend:#c92a2a; --form:#8d97a2; --grid:#e4e0d7; --sheet:#faf9f6;
  --warn-bg:#fff4e6; --warn-ink:#8a3b00; --err-bg:#ffe3e3; --err-ink:#9b1c1c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171a; --panel:#1c2024; --ink:#e5e8eb; --muted:#97a0aa; --line:#2e343a; --soft:#252a2f;
    --accent:#ff7a3d; --accent-ink:#1a0d05; --cut:#e5e8eb; --bend:#ff6b6b; --form:#6f7a85; --grid:#22272c; --sheet:#181b1f;
    --warn-bg:#3a2a12; --warn-ink:#ffc078; --err-bg:#3d1818; --err-ink:#ffa8a8;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
.brand svg{width:24px;height:24px;stroke:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--panel)}
.app{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px 28px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tool{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;text-align:left;font-size:12.5px;line-height:1.2}
.tool svg{flex:none;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tool.on svg{stroke:var(--accent)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.field{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:8px;padding:5px 0}
.field label{font-size:13px}
.field input,.field select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field input.bad{border-color:var(--bend);background:var(--err-bg)}
.field .help{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.field.hide{display:none}
.msgs div{margin-top:10px;padding:8px 10px;border-radius:6px;font-size:12.5px}
.msgs .w{background:var(--warn-bg);color:var(--warn-ink)}
.msgs .e{background:var(--err-bg);color:var(--err-ink)}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted)}
.work{display:flex;flex-direction:column;min-width:0;overflow:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .title{font-weight:600}
.bar .title small{font-weight:400;color:var(--muted);margin-left:6px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chk{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);margin-right:4px;cursor:pointer}
.view{position:relative;flex:1 1 auto;min-height:420px;background:var(--sheet);border-bottom:1px solid var(--line);touch-action:none;overflow:hidden}
.view svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none}
.view svg:active{cursor:grabbing}
.legend{position:absolute;left:10px;bottom:8px;display:flex;gap:12px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--sheet) 85%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.lower{display:grid;grid-template-columns:minmax(260px,1fr) 1.4fr;gap:14px;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ch{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;display:flex;justify-content:space-between}
.ch span{font-weight:400;color:var(--muted);font-size:12px}
#c3{display:block;width:100%;height:280px;touch-action:none;cursor:grab}
.tw{max-height:360px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 10px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;font-size:11.5px}
td:first-child,th:first-child{text-align:left}
td .fr{color:var(--muted);margin-left:6px}
tr.grp td{background:var(--soft);font-weight:600;text-align:left}
#notes{margin:0;padding:8px 12px 12px 28px;font-size:12px;color:var(--muted)}
#notes li{margin:3px 0}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .view{min-height:62vh}
  .lower{grid-template-columns:1fr}
  .work{overflow:visible}
}
@media print{
  .top,.side,.actions,.legend,.lower .card:first-child{display:none!important}
  .app{display:block;height:auto}
  .view{height:60vh;border:1px solid #999}
  .lower{display:block}
  .tw{max-height:none}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="6" rx="5" ry="2"/><path d="M3 19h18M7 6L3 19M17 6l4 13"/></svg>
    <span>Sheet Metal Layout</span>
  </div>
  <div class="seg" id="units"><button data-u="in">in</button><button data-u="mm">mm</button></div>
</header>
<main class="app">
  <aside class="side">
    <div class="tools" id="tools"></div>
    <form id="form" autocomplete="off" onsubmit="return false"></form>
    <div class="msgs" id="msgs"></div>
    <div class="foot">Inches accept fractions: <code>12 1/2</code> or <code>12-1/2</code>. The link in your address bar saves the current fitting.</div>
  </aside>
  <section class="work">
    <div class="bar">
      <div class="title" id="ptitle"></div>
      <div class="actions">
        <label class="chk"><input type="checkbox" id="lbl"> Point labels</label>
        <button class="btn" id="fit">Fit</button>
        <button class="btn pri" id="dxf">DXF</button>
        <button class="btn" id="svgx">SVG</button>
        <button class="btn" id="csv">CSV</button>
        <button class="btn" id="prt">Print</button>
      </div>
    </div>
    <div class="view" id="view">
      <svg id="flat" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend"><span><i style="border-color:var(--cut)"></i>Cut</span><span><i style="border-color:var(--bend);border-top-style:dashed"></i>Bend / break</span><span><i style="border-color:var(--form);border-top-style:dotted"></i>Layout / roll lines</span><span id="gridlbl"></span></div>
    </div>
    <div class="lower">
      <div class="card"><div class="ch">3D check <span>drag to rotate</span></div><canvas id="c3"></canvas></div>
      <div class="card"><div class="ch" id="ttitle">Layout data</div><div class="tw" id="table"></div><ul id="notes"></ul></div>
    </div>
  </section>
</main>
<script>
"use strict";
/* ============================================================
   Geometry core
   ============================================================ */
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const d3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const V = (id, p, name) => ({ id, p, name: name ?? id });
const R = (b, t, kind) => ({ b, t, kind });
const adj = p => p.ref === 'inside' ? p.t : p.ref === 'outside' ? -p.t : 0; // full-dimension change to reach mean line

/* Place a new flat point Q from two circle constraints, keeping strip orientation consistent. */
function place(S, O, rs, ro, mode) {
  const dx = O[0] - S[0], dy = O[1] - S[1], d = Math.hypot(dx, dy);
  if (d < 1e-12) return [S[0] + rs, S[1]];
  const a = (rs * rs - ro * ro + d * d) / (2 * d), h = Math.sqrt(Math.max(0, rs * rs - a * a));
  const ux = dx / d, uy = dy / d, mx = S[0] + a * ux, my = S[1] + a * uy;
  const c = [[mx - h * uy, my + h * ux], [mx + h * uy, my - h * ux]];
  const score = q => mode === 'b'
    ? (q[0] - O[0]) * (S[1] - O[1]) - (q[1] - O[1]) * (S[0] - O[0])   // cross(Q-oldB, T-oldB)
    : (q[0] - S[0]) * (O[1] - S[1]) - (q[1] - S[1]) * (O[0] - S[0]);  // cross(Q-B, oldT-B)
  return score(c[0]) >= score(c[1]) ? c[0] : c[1];
}

/* Develop a triangulated strip. Rungs connect a "bottom" vertex to a "top" vertex;
   consecutive rungs change exactly one end. Returns flat outline and interior lines. */
function unfold(rungs) {
  const r0 = rungs[0];
  let cb = r0.b, ct = r0.t, b2 = [0, 0], t2 = [0, d3(cb.p, ct.p)];
  const B = [{ p: b2, n: cb.name }], T = [{ p: t2, n: ct.name }], lines = [{ a: b2, c: t2, kind: r0.kind }];
  for (let i = 1; i < rungs.length; i++) {
    const r = rungs[i], bc = r.b.id !== cb.id, tc = r.t.id !== ct.id;
    if (!bc && !tc) continue;
    if (bc && tc) throw new Error('strip step changes both ends');
    if (bc) { b2 = place(t2, b2, d3(ct.p, r.b.p), d3(cb.p, r.b.p), 'b'); cb = r.b; B.push({ p: b2, n: cb.name }); }
    else { t2 = place(b2, t2, d3(cb.p, r.t.p), d3(ct.p, r.t.p), 't'); ct = r.t; T.push({ p: t2, n: ct.name }); }
    lines.push({ a: b2, c: t2, kind: r.kind });
  }
  return { B, T, lines };
}

function stripPiece(rungs, name, qty = 1) {
  const u = unfold(rungs);
  const outline = [...u.B.map(o => o.p), ...u.T.slice().reverse().map(o => o.p), u.B[0].p];
  const bend = [], form = [];
  u.lines.forEach((l, i) => {
    if (i === 0 || i === u.lines.length - 1) return;
    if (l.kind === 'break') bend.push([l.a, l.c]);
    else if (l.kind === 'form') form.push([l.a, l.c]);
  });
  const labels = [...u.B, ...u.T].map(o => ({ p: o.p, t: o.n }));
  return { name, qty, cut: [outline], bend, form, labels };
}

function sliceLoop(loop, a, b) {
  const out = []; let i = a;
  do { out.push(loop[i]); i = (i + 1) % loop.length; } while (i !== b);
  out.push(loop[b]);
  return out;
}

function piecesFromLoop(loop, seamIdx, label) {
  const n = seamIdx.length;
  return seamIdx.map((a, i) => stripPiece(sliceLoop(loop, a, seamIdx[(i + 1) % n]), n === 1 ? label : `${label} · piece ${i + 1} of ${n}`));
}

function ring3(c, r, axisU, axisV, seg = 72) {
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const a = TAU * i / seg, ca = Math.cos(a) * r, sa = Math.sin(a) * r;
    pts.push([c[0] + ca * axisU[0] + sa * axisV[0], c[1] + ca * axisU[1] + sa * axisV[1], c[2] + ca * axisU[2] + sa * axisV[2]]);
  }
  return pts;
}
const polyLines = (pts, kind) => pts.slice(1).map((p, i) => ({ a: pts[i], b: p, kind }));

/* ---------- Tool: rectangle to round ---------- */
function rtr(p) {
  const a = adj(p), W = p.w + a, D = p.d + a, r = (p.dia + a) / 2, H = p.h, k = p.k, n = 4 * k;
  const warn = [];
  if (Math.abs(p.ox) + r > W / 2 + 1e-9 || Math.abs(p.oy) + r > D / 2 + 1e-9) warn.push('The round overhangs the rectangle in plan. The pattern is still valid, but double-check the shape in the 3D view.');
  const P = []; for (let j = 0; j < n; j++) { const th = -Math.PI / 2 + j * TAU / n; P.push(V('P' + j, [p.ox + r * Math.cos(th), p.oy + r * Math.sin(th), H], String(j + 1))); }
  const C = [V('C1', [W / 2, -D / 2, 0]), V('C2', [W / 2, D / 2, 0]), V('C3', [-W / 2, D / 2, 0]), V('C4', [-W / 2, -D / 2, 0])];
  const M = [V('M1', [0, -D / 2, 0]), V('M2', [W / 2, 0, 0]), V('M3', [0, D / 2, 0]), V('M4', [-W / 2, 0, 0])];
  const loop = [], mi = [];
  for (let s = 0; s < 4; s++) {
    mi[s] = loop.length; loop.push(R(M[s], P[s * k], 'seam'));
    for (let j = s * k; j <= (s + 1) * k; j++) loop.push(R(C[s], P[j % n], (j === s * k || j === (s + 1) * k) ? 'break' : 'form'));
  }
  const pc = +p.pc, sd = +p.seam;
  const seams = pc === 1 ? [mi[sd]] : pc === 2 ? [mi[sd], mi[(sd + 2) % 4]] : mi.slice();
  const pieces = piecesFromLoop(loop, seams, 'Rectangle to round');
  const rows = [];
  rows.push({ grp: 'True lengths (corner → round point)' });
  loop.forEach(l => rows.push([`${l.b.name} – ${l.t.name}`, { len: d3(l.b.p, l.t.p) }]));
  rows.push({ grp: 'Edge spacing' });
  rows.push(['Round division (chord)', { len: 2 * r * Math.sin(Math.PI / n) }]);
  rows.push(['Rectangle half-width (C – M on front/back)', { len: W / 2 }]);
  rows.push(['Rectangle half-depth (C – M on sides)', { len: D / 2 }]);
  const m3 = [];
  m3.push(...polyLines([...C, C[0]].map(v => v.p), 'edge'));
  m3.push(...polyLines([...P, P[0]].map(v => v.p), 'edge'));
  loop.forEach(l => { if (l.kind !== 'seam') m3.push({ a: l.b.p, b: l.t.p, kind: l.kind }); });
  seams.forEach(i => m3.push({ a: loop[i].b.p, b: loop[i].t.p, kind: 'edge' }));
  return {
    pieces, model: m3, table: { cols: ['Line', 'True length'], rows }, warn,
    notes: ['C = rectangle corners (C1 front-right, counter-clockwise), M = side midpoints, 1… = round division points starting at the front.',
      'Dashed lines are the main breaks; dotted lines are light bends/roll lines.',
      'Developed on the mean line. Add seam/lock allowances to the seam edges as your shop requires.']
  };
}

/* ---------- Tool: rectangle to rectangle ---------- */
function rect2(p) {
  const a = adj(p), W1 = p.w1 + a, D1 = p.d1 + a, W2 = p.w2 + a, D2 = p.d2 + a, H = p.h, ox = p.ox, oy = p.oy;
  const cb = [[W1 / 2, -D1 / 2], [W1 / 2, D1 / 2], [-W1 / 2, D1 / 2], [-W1 / 2, -D1 / 2]];
  const ct = [[W2 / 2, -D2 / 2], [W2 / 2, D2 / 2], [-W2 / 2, D2 / 2], [-W2 / 2, -D2 / 2]];
  const mb = [[0, -D1 / 2], [W1 / 2, 0], [0, D1 / 2], [-W1 / 2, 0]], mt = [[0, -D2 / 2], [W2 / 2, 0], [0, D2 / 2], [-W2 / 2, 0]];
  const CB = cb.map((q, i) => V('CB' + i, [q[0], q[1], 0], 'C' + (i + 1)));
  const CT = ct.map((q, i) => V('CT' + i, [q[0] + ox, q[1] + oy, H], 'C' + (i + 1) + '′'));
  const MB = mb.map((q, i) => V('MB' + i, [q[0], q[1], 0], 'M' + (i + 1)));
  const MT = mt.map((q, i) => V('MT' + i, [q[0] + ox, q[1] + oy, H], 'M' + (i + 1) + '′'));
  const loop = [], mi = [];
  for (let s = 0; s < 4; s++) {
    mi[s] = loop.length;
    loop.push(R(MB[s], MT[s], 'seam'));
    loop.push(R(CB[s], MT[s], 'diag'));
    loop.push(R(CB[s], CT[s], 'break'));
    loop.push(R(MB[(s + 1) % 4], CT[s], 'diag'));
  }
  const pc = +p.pc, sd = +p.seam;
  const seams = pc === 1 ? [mi[sd]] : pc === 2 ? [mi[sd], mi[(sd + 2) % 4]] : mi.slice();
  const pieces = piecesFromLoop(loop, seams, 'Rectangle transition');
  const rows = [{ grp: 'True lengths' }];
  loop.forEach(l => rows.push([`${l.b.name} – ${l.t.name}${l.kind === 'diag' ? ' (diagonal)' : ''}`, { len: d3(l.b.p, l.t.p) }]));
  rows.push({ grp: 'Edges' });
  rows.push(['Bottom half-width / half-depth', { len: W1 / 2 }, { len: D1 / 2 }]);
  rows.push(['Top half-width / half-depth', { len: W2 / 2 }, { len: D2 / 2 }]);
  const m3 = [];
  m3.push(...polyLines([...CB, CB[0]].map(v => v.p), 'edge'), ...polyLines([...CT, CT[0]].map(v => v.p), 'edge'));
  for (let i = 0; i < 4; i++) m3.push({ a: CB[i].p, b: CT[i].p, kind: 'break' });
  return {
    pieces, model: m3, table: { cols: ['Line', 'True length', ''], rows }, warn: [],
    notes: ['Each face is flat; diagonals are only used for layout by triangulation.',
      'Primed points (′) are on the top rectangle.', 'Add seam/lock allowances as required.']
  };
}

/* ---------- Tool: concentric cone / reducer (radial line, exact) ---------- */
function cone(p) {
  const a = adj(p); let r1 = (p.d1 + a) / 2, r2 = p.d2 > 0 ? (p.d2 + a) / 2 : 0;
  if (r2 > r1) [r1, r2] = [r2, r1];
  const H = p.h, pc = Math.max(1, p.pc | 0), k = Math.max(1, p.k | 0), warn = [], rows = [], pieces = [];
  const m3 = [...polyLines(ring3([0, 0, 0], r1, [1, 0, 0], [0, 1, 0]), 'edge')];
  if (r2 > 0) m3.push(...polyLines(ring3([0, 0, H], r2, [1, 0, 0], [0, 1, 0]), 'edge'));
  const gens = k * pc;
  for (let i = 0; i < gens; i++) { const t = TAU * i / gens; m3.push({ a: [r1 * Math.cos(t), r1 * Math.sin(t), 0], b: [r2 * Math.cos(t), r2 * Math.sin(t), H], kind: 'form' }); }
  if (Math.abs(r1 - r2) < 1e-9) {
    const Cw = TAU * r1 / pc;
    for (let i = 0; i < pc; i++) {
      const form = []; for (let j = 1; j < k; j++) form.push([[Cw * j / k, 0], [Cw * j / k, H]]);
      pieces.push({ name: pc > 1 ? `Cylinder · piece ${i + 1} of ${pc}` : 'Cylinder', qty: 1, cut: [[[0, 0], [Cw, 0], [Cw, H], [0, H], [0, 0]]], bend: [], form, labels: [] });
    }
    rows.push(['Stretch-out per piece', { len: Cw }], ['Height', { len: H }]);
    return { pieces, model: m3, table: { cols: ['Item', 'Value'], rows }, warn: ['Diameters are equal, so this is a straight cylinder.'], notes: [] };
  }
  const s = Math.hypot(H, r1 - r2), Ro = r1 * s / (r1 - r2), Ri = Ro - s, tot = TAU * r1 / Ro, per = tot / pc;
  const seg = Math.max(48, Math.ceil(per / D2R * 2));
  for (let i = 0; i < pc; i++) {
    const outl = [], a0 = -Math.PI / 2 - per / 2;
    for (let j = 0; j <= seg; j++) { const t = a0 + per * j / seg; outl.push([Ro * Math.cos(t), Ro * Math.sin(t)]); }
    if (Ri > 1e-9) for (let j = seg; j >= 0; j--) { const t = a0 + per * j / seg; outl.push([Ri * Math.cos(t), Ri * Math.sin(t)]); }
    else outl.push([0, 0]);
    outl.push(outl[0]);
    const form = []; for (let j = 1; j < k; j++) { const t = a0 + per * j / k; form.push([[Ri * Math.cos(t), Ri * Math.sin(t)], [Ro * Math.cos(t), Ro * Math.sin(t)]]); }
    pieces.push({ name: pc > 1 ? `Cone · piece ${i + 1} of ${pc}` : 'Cone', qty: 1, cut: [outl], bend: [], form, labels: [] });
  }
  rows.push({ grp: 'Radial-line layout (swing from apex)' });
  rows.push(['Slant height', { len: s }]);
  rows.push(['Outer radius (large end)', { len: Ro }]);
  rows.push(['Inner radius (small end)', { len: Ri }]);
  rows.push(['Total included angle', { ang: tot / D2R }]);
  rows.push(['Angle per piece', { ang: per / D2R }]);
  rows.push(['Outer arc per piece', { len: Ro * per }]);
  rows.push(['Inner arc per piece', { len: Ri * per }]);

/* ---------- Tool: offset round to round (triangulation) ---------- */
function ecc(p) {
  const a = adj(p), r1 = (p.d1 + a) / 2, r2 = (p.d2 + a) / 2, H = p.h, k = p.k, n = 4 * k;
  const off = Math.hypot(p.ox, p.oy), phi = off > 1e-9 ? Math.atan2(p.oy, p.ox) : -Math.PI / 2;
  const P = [], Q = [];
  for (let j = 0; j < n; j++) {
    const t = phi + TAU * j / n, c = Math.cos(t), s = Math.sin(t);
    P.push(V('P' + j, [r1 * c, r1 * s, 0], String(j + 1)));
    Q.push(V('Q' + j, [p.ox + r2 * c, p.oy + r2 * s, H], (j + 1) + '′'));
  }
  const loop = [], ei = [];
  for (let j = 0; j < n; j++) {
    const j1 = (j + 1) % n;
    ei[j] = loop.length; loop.push(R(P[j], Q[j], 'form'));
    if (d3(P[j1].p, Q[j].p) <= d3(P[j].p, Q[j1].p)) loop.push(R(P[j1], Q[j], 'diag')); else loop.push(R(P[j], Q[j1], 'diag'));
  }
  const L0 = d3(P[0].p, Q[0].p), Lh = d3(P[n / 2].p, Q[n / 2].p);
  const shortI = L0 <= Lh ? 0 : n / 2, longI = (shortI + n / 2) % n;
  const s0 = p.seam === 'short' ? shortI : longI;
  const seams = +p.pc === 2 ? [ei[s0], ei[(s0 + n / 2) % n]] : [ei[s0]];
  const pieces = piecesFromLoop(loop, seams, 'Offset round to round');
  const rows = [{ grp: 'True lengths' }];
  loop.forEach(l => rows.push([`${l.b.name} – ${l.t.name}${l.kind === 'diag' ? ' (diagonal)' : ''}`, { len: d3(l.b.p, l.t.p) }]));
  rows.push({ grp: 'Edge spacing (chords)' });
  rows.push(['Bottom division', { len: 2 * r1 * Math.sin(Math.PI / n) }]);
  rows.push(['Top division', { len: 2 * r2 * Math.sin(Math.PI / n) }]);
  const m3 = [...polyLines([...P, P[0]].map(v => v.p), 'edge'), ...polyLines([...Q, Q[0]].map(v => v.p), 'edge')];
  for (let j = 0; j < n; j++) m3.push({ a: P[j].p, b: Q[j].p, kind: 'form' });
  return {
    pieces, model: m3, table: { cols: ['Line', 'True length'], rows }, warn: [],
    notes: ['Point 1 is in the direction of the offset. Unprimed = bottom (diameter 1), primed = top (diameter 2).',
      'Triangulated development — use more divisions for a closer fit on large fittings.', 'Add seam allowances as required.']
  };
}

/* ---------- Tool: segmented elbow / miter (parallel line) ---------- */
function elbow(p) {
  const a = adj(p), r = (p.dia + a) / 2, A = p.ang * D2R, N = Math.max(2, p.n | 0), Rc = N > 2 ? p.r : 0, L = p.l, k = p.k, m = 4 * k;
  const warn = [];
  if (!(A > 0 && A < Math.PI)) warn.push('Bend angle should be between 0° and 180°.');
  const al = A / (2 * (N - 1)), ta = Math.tan(al), C = TAU * r;
  const th0 = p.seam === 'heel' ? 0 : p.seam === 'throat' ? Math.PI : Math.PI / 2;
  const Lend = L + Rc * ta, Lg = 2 * Rc * ta;
  if (Lend - r * ta < -1e-9) warn.push(`Straight length is too short — the throat of the end piece goes negative. Use at least ${fmtPlain(r * ta - Rc * ta)}.`);
  if (N > 2 && Rc < r) warn.push('Centerline radius is smaller than the pipe radius — gore throats overlap.');
  const S = Math.max(144, m * 8);
  const endTop = th => Lend + r * Math.cos(th) * ta, goreTop = th => Lg / 2 + r * Math.cos(th) * ta;
  const mk = (topF, botF, name, qty) => {
    const top = [], bot = [];
    for (let i = 0; i <= S; i++) { const x = C * i / S, th = th0 + TAU * i / S; top.push([x, topF(th)]); bot.push([x, botF(th)]); }
    const outl = [...bot, ...top.reverse(), bot[0]];
    const form = []; for (let j = 1; j < m; j++) { const x = C * j / m, th = th0 + TAU * j / m; form.push([[x, botF(th)], [x, topF(th)]]); }
    const labels = []; for (let j = 0; j <= m; j += Math.max(1, k / 2 | 0)) { const th = th0 + TAU * j / m; labels.push({ p: [C * j / m, topF(th)], t: String(j % m + 1) }); }
    return { name, qty, cut: [outl], bend: [], form, labels };
  };
  const pieces = [mk(endTop, () => 0, 'End piece', 2)];
  if (N > 2) pieces.push(mk(goreTop, th => -goreTop(th), 'Gore', N - 2));
  const rows = [{ grp: `Element heights (stretch-out ${fmtPlain(C)}, ${m} divisions)` }];
  for (let j = 0; j <= m; j++) {
    const th = th0 + TAU * j / m, row = [`${j % m + 1}  (${Math.round(((th % TAU) + TAU) % TAU / D2R)}° from heel)`, { len: C * j / m }, { len: endTop(th) }];
    if (N > 2) row.push({ len: 2 * goreTop(th) });
    rows.push(row);
  }
  rows.push({ grp: 'Summary' });
  rows.push(['Cut angle at each joint', { ang: al / D2R }]);
  rows.push(['End piece: heel / throat', { len: Lend + r * ta }, { len: Lend - r * ta }]);
  if (N > 2) rows.push(['Gore: heel / throat', { len: Lg + 2 * r * ta }, { len: Lg - 2 * r * ta }]);
  /* 3D */
  const m3 = [], b = [0, 1, 0];
  const dir = f => [Math.cos(f), 0, Math.sin(f)], nrm = f => [Math.sin(f), 0, -Math.cos(f)];
  const curve = (J, f, sg, ofs) => { const d = dir(f), nn = nrm(f), pts = []; for (let i = 0; i <= 64; i++) { const t = TAU * i / 64, ct = Math.cos(t), st = Math.sin(t), e = sg * r * ct * ofs; pts.push([0, 1, 2].map(q => J[q] + r * (ct * nn[q] + st * b[q]) + d[q] * e)); } return pts; };
  let J = [0, 0, 0]; const segs = [];
  for (let i = 0; i < N; i++) {
    const f = i * 2 * al, len = (i === 0 || i === N - 1) ? Lend : Lg, d = dir(f), J2 = J.map((v, q) => v + d[q] * len);
    segs.push({ J, J2, f, s0: i === 0 ? 0 : -1, s1: i === N - 1 ? 0 : 1 }); J = J2;
  }
  segs.forEach(sg => {
    const c0 = curve(sg.J, sg.f, sg.s0, ta), c1 = curve(sg.J2, sg.f, sg.s1, ta);
    m3.push(...polyLines(c0, 'edge'), ...polyLines(c1, 'edge'));
    for (let i = 0; i < 64; i += 8) m3.push({ a: c0[i], b: c1[i], kind: 'form' });
  });
  return {
    pieces, model: m3, table: { cols: N > 2 ? ['Element', 'Position', 'End piece', 'Gore'] : ['Element', 'Position', 'Piece height'], rows }, warn,
    notes: [N > 2 ? `Cut 2 end pieces and ${N - 2} gores. Gores can be nested heel-to-throat on one strip; turn alternate gores 180° to stagger seams.` : 'Two-piece miter: cut 2 identical pieces.',
      'For a 2-piece miter the straight length is the centerline distance from the square end to the miter point.',
      'Element 1 is at the seam. Heights are measured from the square end (end piece) or full length (gore).']
  };
}

/* ---------- Tool: branch / tee / lateral ---------- */
function branch(p) {
  const a = adj(p), Rm = (p.dm + a) / 2, r = (p.db + a) / 2, be = p.beta * D2R, L = p.l, Lm = p.lm, k = p.k, m = 4 * k, warn = [];
  if (r > Rm + 1e-9) return { pieces: [], model: [], table: { cols: [], rows: [] }, warn: [], err: 'Branch diameter must not exceed the main diameter.', notes: [] };
  if (!(be > 5 * D2R && be <= Math.PI / 2 + 1e-9)) return { pieces: [], model: [], table: { cols: [], rows: [] }, warn: [], err: 'Branch angle must be between 5° and 90°.', notes: [] };

  const form = []; for (let j = 1; j < m; j++) { const th = th0 + TAU * j / m; form.push([[C * j / m, t(th)], [C * j / m, L]]); }
  const labels = []; for (let j = 0; j <= m; j += Math.max(1, k / 2 | 0)) labels.push({ p: [C * j / m, t(th0 + TAU * j / m)], t: String(j % m + 1) });
  const pieces = [{ name: 'Branch', qty: 1, cut: [[...bot, ...top.reverse(), bot[0]]], bend: [], form, labels }];
  /* hole in main */
  const hole = [];
  for (let i = 0; i <= S; i++) { const th = TAU * i / S, tt = t(th); hole.push([tt * cb - r * Math.cos(th) * sb, Rm * Math.asin(Math.max(-1, Math.min(1, r * Math.sin(th) / Rm)))]); }

  const rows = [{ grp: `Branch element lengths (stretch-out ${fmtPlain(C)})` }];
  for (let j = 0; j <= m; j++) { const th = th0 + TAU * j / m; rows.push([String(j % m + 1), { len: C * j / m }, { len: L - t(th) }]); }
  rows.push({ grp: 'Main opening (from branch axis, around from top)' });
  for (let j = 0; j < m; j++) { const th = TAU * j / m, tt = t(th); rows.push([`θ ${Math.round(th / D2R)}°`, { len: tt * cb - r * Math.cos(th) * sb }, { len: Rm * Math.asin(Math.max(-1, Math.min(1, r * Math.sin(th) / Rm))) }]); }

  const ax = [cb, 0, sb], u = [-sb, 0, cb], v = [0, 1, 0];

  const m3 = [];
  m3.push(...polyLines(ring3([x0, 0, 0], Rm, [0, 1, 0], [0, 0, 1]), 'edge'), ...polyLines(ring3([x1, 0, 0], Rm, [0, 1, 0], [0, 0, 1]), 'edge'));
  for (let i = 0; i < 12; i++) { const q = TAU * i / 12; m3.push({ a: [x0, Rm * Math.cos(q), Rm * Math.sin(q)], b: [x1, Rm * Math.cos(q), Rm * Math.sin(q)], kind: 'form' }); }

    pieces, model: m3, table: { cols: ['Element', 'Position', 'Length'], rows }, warn,
    notes: ['Branch length is measured along the branch axis from where it crosses the main centerline.',
      'Opening template: X is along the main pipe from the branch axis, the other value is the distance around the main from its top centerline.',
      'Developed on mean diameters. For heavy wall, develop the branch on its inside diameter against the main outside diameter.']
  };
}

let S = { tool: 'rtr', u: 'in', vals: {}, labels: false };
const toolDef = () => TOOLS.find(t => t.id === S.tool) || TOOLS[0];

function parseNum(s) {
  s = String(s).trim().replace(/\s*(in|mm|″|"|°)\s*$/i, '');
  if (s === '') return NaN;
  const m = s.match(/^(-)?\s*(?:(\d*\.?\d+)(?:[\s-]+(\d+)\/(\d+))?|(\d+)\/(\d+))$/);
  if (!m) return NaN;
  let v = m[2] !== undefined ? parseFloat(m[2]) + (m[3] ? m[3] / m[4] : 0) : m[5] / m[6];
  return m[1] ? -v : v;
}
function frac(v, den = 16) {
  const neg = v < 0; v = Math.abs(v);
  const n = Math.round(v * den), w = Math.floor(n / den); let r = n % den, d = den;
  while (r && r % 2 === 0) { r /= 2; d /= 2; }
  return (neg && n ? '-' : '') + (r ? (w ? w + ' ' : '') + r + '/' + d : String(w));
}
function fmtPlain(v) { return S.u === 'in' ? `${v.toFixed(3)}″` : `${v.toFixed(1)} mm`; }
function fmtCell(c) {
  if (c == null) return '';
  if (typeof c === 'string') return esc(c);
  if (c.ang !== undefined) return `${c.ang.toFixed(3)}°`;
  if (S.u === 'in') return `${c.len.toFixed(3)}<span class="fr">${frac(c.len)}</span>`;
  return c.len.toFixed(1);
}
const csvCell = c => c == null ? '' : typeof c === 'string' ? c : c.ang !== undefined ? c.ang.toFixed(4) : c.len.toFixed(S.u === 'in' ? 4 : 2);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

function defaults(t, u) {
  const o = {};
  t.fields.forEach(f => { if (!f.k) return; let v = f.def; if (f.type === 'len' && u === 'mm') v = Math.round(v * 25.4); o[f.k] = String(v); });
  return o;
}
function vals() { return S.vals[S.tool] || (S.vals[S.tool] = defaults(toolDef(), S.u)); }
function parsed() {
  const t = toolDef(), v = vals(), p = {}, bad = [];
  t.fields.forEach(f => {
    if (!f.k) return;
    if (f.type === 'select') { p[f.k] = v[f.k]; return; }
    let x = parseNum(v[f.k]);
    if (f.type === 'int') { x = Math.round(x); if (isFinite(x)) x = Math.min(f.max ?? 1e9, Math.max(f.min ?? 1, x)); }
    if (!isFinite(x)) bad.push(f.k);
    p[f.k] = x;
  });
  return { p, bad };
}

  let res = null, layout = null, vb = null, autoFit = true;

  /* ---- state <-> URL hash ---- */
  function loadHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('u') === 'mm') S.u = 'mm';
    if (TOOLS.some(t => t.id === h.get('tool'))) S.tool = h.get('tool');
    S.labels = h.get('lb') === '1';
    const v = defaults(toolDef(), S.u);
    toolDef().fields.forEach(f => { if (f.k && h.has(f.k)) v[f.k] = h.get(f.k); });
    S.vals[S.tool] = v;
  }
  function saveHash() {
    const h = new URLSearchParams({ tool: S.tool, u: S.u, ...vals() });
    if (S.labels) h.set('lb', '1');
    history.replaceState(null, '', '#' + h.toString());
  }

  /* ---- build controls ---- */
  $('tools').innerHTML = TOOLS.map(t => `<button class="tool" data-t="${t.id}"><svg viewBox="0 0 24 24">${t.icon}</svg><span>${t.name}</span></button>`).join('');
  $('tools').addEventListener('click', e => { const b = e.target.closest('.tool'); if (!b) return; S.tool = b.dataset.t; autoFit = true; buildForm(); update(); });
  $('units').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.u !== S.u) setUnits(b.dataset.u); });

  function setUnits(u) {
    const f = u === 'mm' ? 25.4 : 1 / 25.4;
    for (const id in S.vals) {
      const t = TOOLS.find(x => x.id === id), v = S.vals[id];
      t.fields.forEach(fd => { if (fd.type !== 'len') return; const x = parseNum(v[fd.k]); if (isFinite(x)) v[fd.k] = String(u === 'mm' ? Math.round(x * f * 10) / 10 : Math.round(x * f * 1000) / 1000); });
    }
    S.u = u; autoFit = true; buildForm(); update();
  }

  function buildForm() {
    document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.t === S.tool));
    document.querySelectorAll('#units button').forEach(b => b.classList.toggle('on', b.dataset.u === S.u));
    const t = toolDef(), v = vals();
    form.innerHTML = t.fields.map(f => {
      if (f.sec) return `<div class="sec">${f.sec}</div>`;
      const unit = f.type === 'len' ? ` <span style="color:var(--muted)">(${S.u})</span>` : '';
      const ctl = f.type === 'select'
        ? `<select id="f_${f.k}">${f.opts.map(o => `<option value="${o[0]}"${o[0] === v[f.k] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>`
        : `<input id="f_${f.k}" value="${esc(v[f.k])}" inputmode="${f.type === 'int' ? 'numeric' : 'text'}" spellcheck="false">`;
      return `<div class="field" data-k="${f.k}"><label for="f_${f.k}">${f.label}${unit}</label>${ctl}${f.help ? `<div class="help">${f.help}</div>` : ''}</div>`;
    }).join('');
    $('lbl').checked = S.labels;
  }
  form.addEventListener('input', e => { const k = e.target.id.slice(2); vals()[k] = e.target.value; update(); });
  form.addEventListener('change', e => { const k = e.target.id.slice(2); vals()[k] = e.target.value; update(); });
  $('lbl').addEventListener('change', e => { S.labels = e.target.checked; renderFlat(); saveHash(); });

  /* ---- compute + render ---- */
  function update() {
    const t = toolDef(), { p, bad } = parsed();
    t.fields.forEach(f => {
      if (!f.k) return;
      const el = form.querySelector(`.field[data-k="${f.k}"]`);
      if (el) { el.classList.toggle('hide', !!(f.show && !f.show(p))); el.querySelector('input')?.classList.toggle('bad', bad.includes(f.k)); }
    });
    saveHash();
    const msgs = [];
    if (bad.length) { $('msgs').innerHTML = '<div class="e">Check the highlighted values.</div>'; return; }
    try { res = t.run(p); } catch (err) { res = null; $('msgs').innerHTML = `<div class="e">Couldn't develop this shape: ${esc(err.message)}</div>`; return; }
    if (res.err) msgs.push(`<div class="e">${esc(res.err)}</div>`);
    (res.warn || []).forEach(w => msgs.push(`<div class="w">${esc(w)}</div>`));
    $('msgs').innerHTML = msgs.join('');
    doLayout();
    renderFlat(); if (autoFit) fit();
    render3d(); renderTable();
    const total = res.pieces.reduce((s, pc) => s + pc.qty, 0);
    $('ptitle').innerHTML = `${esc(t.name)}<small>${res.pieces.length} pattern${res.pieces.length === 1 ? '' : 's'}${total !== res.pieces.length ? `, ${total} pieces total` : ''}</small>`;
  }

  function bbox(pts) { let a = [Infinity, Infinity, -Infinity, -Infinity]; for (const q of pts) { a[0] = Math.min(a[0], q[0]); a[1] = Math.min(a[1], q[1]); a[2] = Math.max(a[2], q[0]); a[3] = Math.max(a[3], q[1]); } return a; }

  function doLayout() {
    const ps = res.pieces.map(pc => ({ ...pc, bb: bbox(pc.cut.flat()) }));
    const md = Math.max(1e-6, ...ps.map(q => Math.max(q.bb[2] - q.bb[0], q.bb[3] - q.bb[1])));
    const gap = md * 0.18; let x = 0;
    const tr = (dx, dy) => q => [q[0] + dx, q[1] + dy];
    const out = ps.map(pc => {
      const dx = x - pc.bb[0], dy = -pc.bb[1], f = tr(dx, dy);
      x += pc.bb[2] - pc.bb[0] + gap;
      return {
        name: pc.name, qty: pc.qty, cut: pc.cut.map(l => l.map(f)), bend: pc.bend.map(l => l.map(f)), form: pc.form.map(l => l.map(f)),
        labels: pc.labels.map(l => ({ p: f(l.p), t: l.t })), w: pc.bb[2] - pc.bb[0], h: pc.bb[3] - pc.bb[1],
        bb: [pc.bb[0] + dx, 0, pc.bb[2] + dx, pc.bb[3] - pc.bb[1]]
      };
    });
    const all = bbox(out.flatMap(o => [[o.bb[0], o.bb[1]], [o.bb[2], o.bb[3]]]));
    layout = { pieces: out, bb: all, md, fs: md * 0.035 };
  }

  const pathOf = l => 'M' + l.map(q => `${q[0].toFixed(4)} ${(-q[1]).toFixed(4)}`).join('L');
  function niceStep(x) { const e = Math.pow(10, Math.floor(Math.log10(x))), m = x / e; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e; }

  function svgBody(forExport) {
    if (!layout) return '';
    const L = layout, fs = L.fs, sw = forExport ? `stroke-width="${(L.md * 0.002).toFixed(4)}"` : 'stroke-width="1.6" vector-effect="non-scaling-stroke"';
    const swt = forExport ? `stroke-width="${(L.md * 0.0012).toFixed(4)}"` : 'stroke-width="1.1" vector-effect="non-scaling-stroke"';
    const col = forExport ? { cut: '#000', bend: '#d00', form: '#888', txt: '#333' } : { cut: 'var(--cut)', bend: 'var(--bend)', form: 'var(--form)', txt: 'var(--muted)' };
    let s = '';
    for (const pc of L.pieces) {
      pc.form.forEach(l => s += `<path d="${pathOf(l)}" fill="none" stroke="${col.form}" ${swt} stroke-dasharray="${forExport ? (fs * .25).toFixed(4) + ' ' + (fs * .25).toFixed(4) : '2 3'}"/>`);
      pc.bend.forEach(l => s += `<path d="${pathOf(l)}" fill="none" stroke="${col.bend}" ${sw} stroke-dasharray="${forExport ? (fs * .8).toFixed(4) + ' ' + (fs * .4).toFixed(4) : '8 5'}"/>`);
      pc.cut.forEach(l => s += `<path d="${pathOf(l)}" fill="none" stroke="${col.cut}" ${sw} stroke-linejoin="round"/>`);
      const ttl = `${pc.name}${pc.qty > 1 ? ` — cut ${pc.qty}` : ''}`;
      s += `<text x="${pc.bb[0]}" y="${-pc.bb[3] - fs * 0.9}" font-size="${fs}" font-family="system-ui,sans-serif" font-weight="600" fill="${col.cut}">${esc(ttl)}</text>`;
      s += `<text x="${pc.bb[0]}" y="${fs * 1.7}" font-size="${fs * .8}" font-family="system-ui,sans-serif" fill="${col.txt}">${esc(fmtPlain(pc.w) + ' × ' + fmtPlain(pc.h))} overall</text>`;
      if (S.labels) pc.labels.forEach(l => s += `<text x="${l.p[0]}" y="${-l.p[1]}" font-size="${fs * .55}" font-family="system-ui,sans-serif" fill="${col.txt}" text-anchor="middle" dy="-0.35em">${esc(l.t)}</text>`);
    }
    return s;
  }

  function renderFlat() {
    if (!layout) { svg.innerHTML = ''; return; }
    const step = niceStep(layout.md / 12);
    $('gridlbl').textContent = `Grid ${S.u === 'in' ? frac(step) + '″' : step + ' mm'}`;
    svg.innerHTML = `<defs><pattern id="gp" width="${step}" height="${step}" patternUnits="userSpaceOnUse"><path d="M${step} 0H0V${step}" fill="none" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern></defs>
      <rect x="-1e6" y="-1e6" width="2e6" height="2e6" fill="url(#gp)"/>` + svgBody(false);
    applyVB();
  }

  function fit() {
    if (!layout) return;
    const b = layout.bb, fs = layout.fs, r = view.getBoundingClientRect();
    let x = b[0] - fs * 2, y = -b[3] - fs * 3, w = b[2] - b[0] + fs * 4, h = b[3] - b[1] + fs * 6;
    const ar = r.width / Math.max(1, r.height);
    if (w / h > ar) { const nh = w / ar; y -= (nh - h) / 2; h = nh; } else { const nw = h * ar; x -= (nw - w) / 2; w = nw; }
    vb = { x, y, w, h }; applyVB();
  }
  const applyVB = () => vb && svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  $('fit').onclick = () => { autoFit = true; fit(); };

  /* pan / zoom / pinch */
  const ptrs = new Map(); let pinch0 = null;
  const toModel = (cx, cy) => { const r = svg.getBoundingClientRect(); return [vb.x + (cx - r.left) / r.width * vb.w, vb.y + (cy - r.top) / r.height * vb.h]; };
  function zoomAt(cx, cy, f) { const [mx, my] = toModel(cx, cy); vb.x = mx - (mx - vb.x) * f; vb.y = my - (my - vb.y) * f; vb.w *= f; vb.h *= f; applyVB(); }
  svg.addEventListener('wheel', e => { if (!vb) return; e.preventDefault(); autoFit = false; zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.0015)); }, { passive: false });
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch0 = null; });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !vb) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); autoFit = false;
    const r = svg.getBoundingClientRect();
    if (ptrs.size === 1) { vb.x -= (e.clientX - prev[0]) / r.width * vb.w; vb.y -= (e.clientY - prev[1]) / r.height * vb.h; applyVB(); }
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch0) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch0 / d);
      pinch0 = d;
    }
  });
  const up = e => { ptrs.delete(e.pointerId); pinch0 = null; };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('dblclick', () => { autoFit = true; fit(); });

  /* ---- 3D preview ---- */
  let yaw = -0.6, pitch = 0.45;
  function render3d() {
    const dpr = window.devicePixelRatio || 1, w = c3.clientWidth, h = c3.clientHeight;
    c3.width = w * dpr; c3.height = h * dpr;
    const g = c3.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    if (!res || !res.model.length) return;
    const pts = res.model.flatMap(l => [l.a, l.b]);
    const c = [0, 1, 2].map(i => (Math.min(...pts.map(p => p[i])) + Math.max(...pts.map(p => p[i]))) / 2);
    const rad = Math.max(...pts.map(p => d3(p, c))) || 1, sc = Math.min(w, h) * 0.44 / rad;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const pr = p => { const x = p[0] - c[0], y = p[1] - c[1], z = p[2] - c[2]; const x1 = x * cy - y * sy, y1 = x * sy + y * cy; return [w / 2 + x1 * sc, h / 2 - (z * cp + y1 * sp) * sc]; };
    const cs = getComputedStyle(document.documentElement);
    const colr = { edge: cs.getPropertyValue('--cut'), break: cs.getPropertyValue('--accent'), form: cs.getPropertyValue('--form') };
    for (const kind of ['form', 'break', 'edge']) {
      g.strokeStyle = colr[kind]; g.lineWidth = kind === 'form' ? 0.8 : 1.4; g.globalAlpha = kind === 'form' ? 0.7 : 1;
      g.beginPath();
      res.model.forEach(l => { if ((l.kind === kind) || (kind === 'edge' && !colr[l.kind])) { const a = pr(l.a), b = pr(l.b); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); } });
      g.stroke();
    }
    g.globalAlpha = 1;
  }
  let drag3 = null;
  c3.addEventListener('pointerdown', e => { c3.setPointerCapture(e.pointerId); drag3 = [e.clientX, e.clientY]; });
  c3.addEventListener('pointermove', e => { if (!drag3) return; yaw += (e.clientX - drag3[0]) * 0.01; pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - drag3[1]) * 0.01)); drag3 = [e.clientX, e.clientY]; render3d(); });
  c3.addEventListener('pointerup', () => drag3 = null); c3.addEventListener('pointercancel', () => drag3 = null);

  /* ---- table ---- */
  function renderTable() {
    const tb = res.table;
    $('ttitle').textContent = `Layout data (${S.u})`;
    if (!tb.rows.length) { $('table').innerHTML = ''; $('notes').innerHTML = ''; return; }
    const nc = tb.cols.length;
    $('table').innerHTML = `<table><thead><tr>${tb.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r => r.grp ? `<tr class="grp"><td colspan="${nc}">${esc(r.grp)}</td></tr>` : `<tr>${Array.from({ length: nc }, (_, i) => `<td>${fmtCell(r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    $('notes').innerHTML = (res.notes || []).map(n => `<li>${esc(n)}</li>`).join('');
  }

  /* ---- exports ---- */
  function download(name, text, type) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const fname = ext => `${S.tool}-pattern.${ext}`;
  $('dxf').onclick = () => {
    if (!layout) return;
    const o = [], n = v => v.toFixed(6), add = (...a) => o.push(...a);
    add('0', 'SECTION', '2', 'HEADER', '9', '$ACADVER', '1', 'AC1009', '9', '$INSUNITS', '70', S.u === 'in' ? '1' : '4', '0', 'ENDSEC');
    add('0', 'SECTION', '2', 'TABLES', '0', 'TABLE', '2', 'LAYER', '70', '4');
    [['CUT', 7], ['BEND', 1], ['FORM', 8], ['TEXT', 3]].forEach(([nm, c]) => add('0', 'LAYER', '2', nm, '70', '0', '62', String(c), '6', 'CONTINUOUS'));
    add('0', 'ENDTAB', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES');
    const line = (ly, a, b) => add('0', 'LINE', '8', ly, '10', n(a[0]), '20', n(a[1]), '30', '0', '11', n(b[0]), '21', n(b[1]), '31', '0');
    const poly = (ly, l) => { for (let i = 1; i < l.length; i++) if (Math.hypot(l[i][0] - l[i - 1][0], l[i][1] - l[i - 1][1]) > 1e-9) line(ly, l[i - 1], l[i]); };
    const text = (ly, p, h, s) => add('0', 'TEXT', '8', ly, '10', n(p[0]), '20', n(p[1]), '30', '0', '40', n(h), '1', s);
    for (const pc of layout.pieces) {
      pc.cut.forEach(l => poly('CUT', l)); pc.bend.forEach(l => poly('BEND', l)); pc.form.forEach(l => poly('FORM', l));
      text('TEXT', [pc.bb[0], pc.bb[3] + layout.fs * 0.6], layout.fs * 0.8, `${pc.name}${pc.qty > 1 ? ' - CUT ' + pc.qty : ''}`);
      if (S.labels) pc.labels.forEach(l => text('TEXT', l.p, layout.fs * 0.45, l.t.replace('′', "'")));
    }
    add('0', 'ENDSEC', '0', 'EOF');
    download(fname('dxf'), o.join('\r\n'), 'application/dxf');
  };
  $('svgx').onclick = () => {
    if (!layout) return;
    const b = layout.bb, m = layout.fs * 3, x = b[0] - m, y = -b[3] - m, w = b[2] - b[0] + 2 * m, h = b[3] - b[1] + 2 * m;
    download(fname('svg'), `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${w.toFixed(4)}${S.u}" height="${h.toFixed(4)}${S.u}" viewBox="${x} ${y} ${w} ${h}">${svgBody(true)}</svg>`, 'image/svg+xml');
  };
  $('csv').onclick = () => {
    if (!res) return;
    const q = s => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s, tb = res.table;
    const lines = [tb.cols.map(q).join(','), ...tb.rows.map(r => r.grp ? q(r.grp) : tb.cols.map((_, i) => q(csvCell(r[i]))).join(','))];
    download(fname('csv'), lines.join('\n'), 'text/csv');
  };
  $('prt').onclick = () => window.print();

  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (autoFit) fit(); render3d(); }, 100); });

  loadHash(); buildForm(); update();
})();
</script>
</body>
</html>
