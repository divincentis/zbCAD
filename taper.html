<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taper Studio</title>
<style>
/* Layout: drafting-table workspace. Header strip, inputs on the left, plan sheet on the right with KPIs on top. */
:root {
  --bg: #f6f4ef;
  --panel: #fffdf8;
  --sheet: #fbf9f4;
  --ink: #1c1b19;
  --muted: #6b675f;
  --line: #d9d4c9;
  --accent: #9a4a1f;
  --accent-ink: #ffffff;
  --crk: #b8741a;
  --bad: #b3261e;
  --good: #2c7448;
  --cell: #fffdf8;
  --crk-fill: #f4e2c3;
  --bad-fill: #f7d5d1;
  --grid: #b5ad9e;
  --heat: #1d5f86;
  --sel: #f3e6d8;
  --f-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --f-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --panel: #1c1b19; --sheet: #181816; --ink: #e9e5dc; --muted: #9a958a; --line: #2f2d29;
  --accent: #e08a55; --accent-ink: #1a0d05; --crk: #e3a64f; --bad: #f07b70; --good: #6cc08b;
  --cell: #1c1b19; --crk-fill: #3b2e19; --bad-fill: #47211e; --grid: #4a463f; --heat: #6fb2dc; --sel: #3a2c22; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161614; --panel: #1c1b19; --sheet: #181816; --ink: #e9e5dc; --muted: #9a958a; --line: #2f2d29;
  --accent: #e08a55; --accent-ink: #1a0d05; --crk: #e3a64f; --bad: #f07b70; --good: #6cc08b;
  --cell: #1c1b19; --crk-fill: #3b2e19; --bad-fill: #47211e; --grid: #4a463f; --heat: #6fb2dc; --sel: #3a2c22; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand a { color: var(--muted); text-decoration: none; }
.brand a:hover, .brand a:focus-visible { color: var(--accent); }
.brand .sep { color: var(--line); margin: 0 7px; font-weight: 400; }
#projName { flex: 1 1 220px; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 5px 8px; font-weight: 600; font-size: 15px; }
#projName:hover, #projName:focus { border-color: var(--line); background: var(--sheet); }
.exports { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.exports .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-stretch: 80%; margin-right: 2px; }
.btn, .exports button, .exports label.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 4px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover, .exports button:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.vis { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.work { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; min-height: 0; }
#side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 10px 9px; cursor: pointer; font-weight: 600; font-stretch: 85%; letter-spacing: .03em; text-transform: uppercase; font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panes { overflow-y: auto; padding: 4px 16px 24px; min-height: 0; }
.grp { padding-block: 14px; border-bottom: 1px dashed var(--line); display: grid; gap: 10px; }
.grp:last-child { border-bottom: 0; }
h3 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-stretch: 80%; font-weight: 700; color: var(--muted); }
h4 { margin: 6px 0 0; font-size: 13px; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 500; }
label.full { display: grid; }
label.cb { display: flex; align-items: center; gap: 7px; color: var(--ink); font-size: 13px; }
.row label { flex: 1 1 90px; min-width: 0; }
.row label.grow, .grow { flex: 3 1 160px; }
input, select { border: 1px solid var(--line); background: var(--sheet); border-radius: 4px; padding: 5px 7px; width: 100%; min-width: 0; color: var(--ink); font-size: 13.5px; }
input[data-type="num"], .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
input.invalid { border-color: var(--bad); }
.row > button, .grp > .row button { border: 1px solid var(--line); background: var(--sheet); border-radius: 4px; padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.row > button:hover { border-color: var(--accent); }
.hint-s { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 62ch; }
.empty { margin: 0; font-size: 13px; color: var(--muted); }
.dim-off { opacity: .45; }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 3px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); vertical-align: middle; }
.tbl td input { padding: 4px 5px; min-width: 52px; }
.tbl tr.sel td { background: var(--sel); }
.tbl .w-name { min-width: 100px; }
.tbl .w-code { min-width: 44px; font-weight: 700; }
.tbl .warn { color: var(--bad); }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 3px; }
.x:hover { color: var(--bad); background: var(--bad-fill); }
.seg { display: grid; gap: 6px; }
.seg label { display: flex; gap: 9px; align-items: flex-start; border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: pointer; background: var(--sheet); color: var(--ink); font-size: 12.5px; }
.seg label:has(input:checked) { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.seg b { display: block; font-size: 13.5px; }
.seg input { margin-top: 3px; }
.series { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 8px; background: var(--sheet); }
.series .sname { font-weight: 700; }
.prog { margin: 0; font-size: 12.5px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 5px; }
.prog span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.prog b { font-family: var(--f-mono); font-weight: 600; }
.prog b.warn { color: var(--bad); }
.prog i { color: var(--muted); font-style: normal; }

.to td small { display: block; color: var(--muted); font-size: 11.5px; }
.to .num, .tbl th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.to tr.gh th { padding-top: 12px; color: var(--accent); }
.to tfoot td { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; }
.warns { margin: 0; padding: 10px 12px 10px 28px; border: 1px solid var(--bad); background: var(--bad-fill); border-radius: 5px; font-size: 13px; display: grid; gap: 4px; }
.okline { margin: 0; padding: 8px 12px; border-left: 3px solid var(--good); font-size: 13px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; margin: 0; }
.facts div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding-block: 3px; font-size: 12.5px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rgrid > div { border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; background: var(--sheet); display: grid; gap: 3px; align-content: start; }
.rgrid span { font-size: 11.5px; color: var(--muted); }
.rgrid b { font-size: 21px; font-stretch: 80%; font-weight: 800; font-variant-numeric: tabular-nums; }
.rgrid em { font-style: normal; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.hist { width: 100%; max-width: 420px; }
.hist rect { fill: var(--accent); }
.hist .ax { fill: var(--muted); font-size: 9px; text-anchor: middle; font-family: var(--f-mono); }
.hist .vl { fill: var(--ink); font-size: 9px; text-anchor: middle; font-family: var(--f-mono); }
.hist .base { stroke: var(--line); }
.chip { display: inline-block; justify-self: start; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; font-style: normal; }
.chip.ok { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.chip.no { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; min-height: 0; min-width: 0; }
#kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line); background: var(--panel); }
.kpi { display: grid; gap: 1px; padding: 9px 14px; border-right: 1px solid var(--line); text-align: left; min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi span { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-stretch: 80%; font-weight: 600; }
.kpi b { font-size: 19px; font-weight: 800; font-stretch: 78%; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi em { font-style: normal; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.kpi { border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
button.kpi.has b { color: var(--bad); }
button.kpi:hover { background: var(--sel); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.tools { display: flex; flex-wrap: wrap; max-width: 100%; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.tools button { border: 0; background: none; border-radius: 4px; padding: 5px 9px; cursor: pointer; font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 5px; }
.tools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tools button kbd { font-family: var(--f-mono); font-size: 10px; opacity: .6; }
.tools svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.views { display: flex; gap: 10px; flex-wrap: wrap; }
.views label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink); }
.zoom { display: flex; gap: 4px; margin-left: auto; }
.zoom button { border: 1px solid var(--line); background: var(--sheet); border-radius: 4px; min-width: 30px; padding: 4px 8px; cursor: pointer; font-weight: 700; }
.canvaswrap { position: relative; min-height: 0; background:
  linear-gradient(var(--sheet), var(--sheet)); overflow: hidden; }
#plan { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; cursor: grab; }
#plan[data-tool="roof"], #plan[data-tool="drain"], #plan[data-tool="scupper"], #plan[data-tool="curb"], #plan[data-tool="edge"] { cursor: crosshair; }
#plan text { font-family: var(--f-ui); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#plan * { vector-effect: non-scaling-stroke; }
.cell { fill: var(--cell); stroke: var(--grid); stroke-width: .6; }
.cell.crk { fill: var(--crk-fill); }
.cell.bad { fill: var(--bad-fill); }
.miter { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
.roof { fill: none; stroke: var(--ink); stroke-width: 2.4; }
.gutter { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; opacity: .85; }
.cband { fill: var(--crk-fill); stroke: color-mix(in srgb, var(--crk) 45%, var(--grid)); stroke-width: .6; }
.cband.bad { fill: var(--bad-fill); }
.valley { stroke: var(--crk); stroke-width: 2.2; stroke-linecap: round; }
.ridge { stroke: var(--crk); stroke-width: 1.1; stroke-dasharray: 6 4; }
.arw.ck { stroke: var(--crk); }
#plan .pl.ck { fill: var(--ink); }
.ratio { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.ratio label { flex: 0 1 150px; }
.ratio-in { display: flex; align-items: center; gap: 6px; }
.ratio-in b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; white-space: nowrap; }
.ratio-fig { flex: 1 1 150px; max-width: 220px; }
.ratio-fig .rf-drain { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; }
.ratio-fig .rf-c { fill: var(--crk-fill); stroke: var(--crk); stroke-width: 1.6; }
.ratio-fig .rf-r { stroke: var(--crk); stroke-width: .8; stroke-dasharray: 4 3; }
.ratio-fig .rf-d { fill: var(--sheet); stroke: var(--bad); stroke-width: 1.4; }
.ratio-fig text { fill: var(--muted); font-size: 9px; text-anchor: middle; font-family: var(--f-ui); }
.ratio-fig text.l { text-anchor: start; }
.curb { fill: url(#hatch); stroke: var(--ink); stroke-width: 1.5; }
.curb.sel, .drn.sel { stroke: var(--accent); stroke-width: 3; }
.drn { fill: var(--sheet); stroke: var(--bad); stroke-width: 1.8; }
.drnx { stroke: var(--bad); stroke-width: 1.2; }
#plan .pl { fill: var(--ink); font-weight: 700; }
#plan .pl.bad { fill: var(--bad); }
#plan .pf { fill: var(--muted); font-family: var(--f-mono); }
#plan .cl { fill: var(--ink); font-weight: 700; font-stretch: 80%; }
#plan .dl { fill: var(--bad); font-weight: 700; text-anchor: start; }
.arw { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.dim path { fill: none; stroke: var(--muted); stroke-width: .9; }
#plan .dim text { fill: var(--muted); font-family: var(--f-mono); }
#plan.lod-lo .pf, #plan.lod-lo .arw { display: none; }
#plan.lod-min .pl, #plan.lod-min .dl { display: none; }
.vh { fill: var(--sheet); stroke: var(--accent); stroke-width: 1.5; }
.vh.sel { fill: var(--accent); }
.draft { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
.draftpt { fill: var(--sheet); stroke: var(--accent); stroke-width: 1.5; }
.draftpt.first { fill: var(--accent); }
.draftrect { fill: color-mix(in srgb, var(--accent) 15%, transparent); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.edgehl { stroke: var(--accent); stroke-width: 9; opacity: .4; stroke-linecap: round; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; font-size: 11.5px; max-width: calc(100% - 24px); pointer-events: none; }
.legend i { display: inline-block; width: 14px; height: 10px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--grid); }
.statusbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); }
#cursor { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.statusbar > span { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 5px; font-size: 13px; font-weight: 600; z-index: 10; max-width: calc(100% - 32px); }

@media (max-width: 1180px) { #kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi:nth-child(3) { border-right: 0; } .kpi:nth-child(-n+3) { border-bottom: 1px solid var(--line); } }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { order: 1; grid-template-rows: auto auto 64vh auto; }
  #side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .panes { overflow: visible; }
  .tools button kbd { display: none; }
  .zoom { margin-left: 0; }
}
@media (max-width: 520px) { #kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi { border-bottom: 1px solid var(--line); } .kpi:nth-child(odd) { border-right: 1px solid var(--line) !important; } .kpi:nth-child(even) { border-right: 0; } .rgrid, .facts { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><a href="/">zbCAD</a><span class="sep">/</span><span>Taper Studio</span></div>
    <input id="projName" aria-label="Project name" value="">
    <div class="exports">
      <span class="lbl">Export</span>
      <button type="button" id="exSVG" title="Shop drawing with title block, panel key and legend">Plan SVG</button>
      <button type="button" id="exDXF" title="Layered DXF for CAD">DXF</button>
      <button type="button" id="exXLSX" title="Takeoff, panel schedule, R-value and inputs">Excel</button>
      <button type="button" id="exCSV">CSV</button>
      <span class="lbl" style="margin-left:8px">Project</span>
      <button type="button" id="exJSON">Save</button>
      <label class="btn" for="openJSON">Open</label><input type="file" id="openJSON" accept=".json,application/json" class="vis">
      <button type="button" id="newBlank">New</button>
      <button type="button" id="resetSample">Sample</button>
    </div>
  </header>

  <div class="work">
    <aside id="side">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="roof">Roof</button>
        <button type="button" role="tab" data-tab="taper">Taper</button>
        <button type="button" role="tab" data-tab="panels">Panels</button>
        <button type="button" role="tab" data-tab="rvalue">R-value</button>
        <button type="button" role="tab" data-tab="takeoff">Takeoff</button>
      </nav>
      <div class="panes">
        <div class="tabpane" id="tab-roof"></div>
        <div class="tabpane" id="tab-taper" hidden></div>
        <div class="tabpane" id="tab-panels" hidden></div>
        <div class="tabpane" id="tab-rvalue" hidden></div>
        <div class="tabpane" id="tab-takeoff" hidden></div>
      </div>
    </aside>

    <main class="stage">
      <div id="kpis"></div>
      <div class="toolbar">
        <div class="tools" role="toolbar" aria-label="Plan tools">
          <button type="button" data-tool="select" title="Select & move (V)"><svg viewBox="0 0 16 16"><path d="M3 2l9 5-4 1-1 4z"/></svg>Select<kbd>V</kbd></button>
          <button type="button" data-tool="roof" title="Draw roof outline (R)"><svg viewBox="0 0 16 16"><path d="M2 13V5l6-3 6 3v8z"/></svg>Roof<kbd>R</kbd></button>
          <button type="button" data-tool="drain" title="Place drain (D)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><path d="M5 8h6M8 5v6"/></svg>Drain<kbd>D</kbd></button>
          <button type="button" data-tool="scupper" title="Place scupper on an edge (S)"><svg viewBox="0 0 16 16"><path d="M2 3v10M2 6h7v4H2"/></svg>Scupper<kbd>S</kbd></button>
          <button type="button" data-tool="curb" title="Add curb (C)"><svg viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="8"/><path d="M3 12l10-8"/></svg>Curb<kbd>C</kbd></button>
          <button type="button" data-tool="edge" title="Toggle edge drain (E)"><svg viewBox="0 0 16 16"><path d="M2 12h12" stroke-width="3"/><path d="M5 4l3 5 3-5"/></svg>Edge<kbd>E</kbd></button>
          <button type="button" data-tool="pan" title="Pan (H)"><svg viewBox="0 0 16 16"><path d="M8 1v14M1 8h14M8 1l-2 2M8 1l2 2M8 15l-2-2M8 15l2-2M1 8l2-2M1 8l2 2M15 8l-2-2M15 8l-2 2"/></svg>Pan<kbd>H</kbd></button>
        </div>
        <div class="views">
          <label><input type="checkbox" id="v-labels"> Panel codes</label>
          <label><input type="checkbox" id="v-arrows"> Slope arrows</label>
          <label><input type="checkbox" id="v-heat"> Thickness map</label>
        </div>
        <div class="zoom">
          <button type="button" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
          <button type="button" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
          <button type="button" id="zout" aria-label="Zoom out">−</button>
          <button type="button" id="zin" aria-label="Zoom in">+</button>
          <button type="button" id="zfit" title="Fit roof (F)">Fit</button>
        </div>
      </div>
      <div class="canvaswrap">
        <svg id="plan" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roof plan with tapered panel layout">
          <defs><pattern id="hatch" width="1" height="1" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1" style="stroke:var(--muted);stroke-width:.18"/></pattern></defs>
          <g id="planContent"></g><g id="overlay"></g>
        </svg>
        <div class="legend" aria-hidden="true">
          <span><i style="background:var(--cell)"></i>Field panels</span>
          <span><i style="background:var(--crk-fill)"></i>Cricket panels (over field)</span>
          <span><i style="background:none;border:0;border-top:2px solid var(--crk);height:0;vertical-align:3px"></i>Valley</span>
          <span><i style="background:var(--bad-fill)"></i>No panel match</span>
          <span id="legendHeat" hidden><i style="background:var(--heat)"></i>Darker = thicker</span>
        </div>
      </div>
      <div class="statusbar"><span id="hint"></span><span id="cursor">—</span></div>
    </main>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
/* Tapered insulation design engine
 * Coordinates in feet, plan view, y increases downward (south).
 * Thickness in inches. Slopes in inches per foot.
 */
const TaperEngine = (() => {
  const r16 = v => Math.round(v * 16) / 16;

  /* ---------- geometry ---------- */
  function polyArea(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      a += p.x * q.y - q.x * p.y;
    }
    return a / 2;
  }
  function polyPerimeter(pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      s += Math.hypot(q.x - p.x, q.y - p.y);
    }
    return s;
  }
  function pointInPoly(x, y, pts) {
    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c;
    }
    return c;
  }
  function clipPolyRect(pts, x0, y0, x1, y1) {
    let out = pts.slice();
    const clip = (inside, inter) => {
      const inp = out; out = [];
      for (let i = 0; i < inp.length; i++) {
        const cur = inp[i], prev = inp[(i + inp.length - 1) % inp.length];
        const ci = inside(cur), pi = inside(prev);
        if (ci) { if (!pi) out.push(inter(prev, cur)); out.push(cur); }
        else if (pi) out.push(inter(prev, cur));
      }
    };
    const ix = X => (a, b) => ({ x: X, y: a.y + (X - a.x) / (b.x - a.x) * (b.y - a.y) });
    const iy = Y => (a, b) => ({ x: a.x + (Y - a.y) / (b.y - a.y) * (b.x - a.x), y: Y });
    clip(p => p.x >= x0, ix(x0)); if (!out.length) return out;
    clip(p => p.x <= x1, ix(x1)); if (!out.length) return out;
    clip(p => p.y >= y0, iy(y0)); if (!out.length) return out;
    clip(p => p.y <= y1, iy(y1));
    return out;
  }
  // keep the side of line (a->b) where dot(p - a, n) >= 0
  function clipHalfPlane(poly, a, b, n) {
    const side = p => (p.x - a.x) * n.x + (p.y - a.y) * n.y;
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const cur = poly[i], prev = poly[(i + poly.length - 1) % poly.length];
      const sc = side(cur), sp = side(prev);
      const lerp = () => { const t = sp / (sp - sc); return { x: prev.x + t * (cur.x - prev.x), y: prev.y + t * (cur.y - prev.y) }; };
      if (sc >= -1e-9) { if (sp < -1e-9) out.push(lerp()); out.push(cur); }
      else if (sp >= -1e-9) out.push(lerp());
    }
    return out;
  }
  function rectOverlap(ax0, ay0, ax1, ay1, bx0, by0, bx1, by1) {
    const w = Math.min(ax1, bx1) - Math.max(ax0, bx0);
    const h = Math.min(ay1, by1) - Math.max(ay0, by0);
    return w > 0 && h > 0 ? w * h : 0;
  }
  function distSeg(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const L2 = dx * dx + dy * dy;
    let t = L2 ? ((px - a.x) * dx + (py - a.y) * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
  }
  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    pts.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
    return { x0, y0, x1, y1 };
  }

  /* ---------- thickness field ----------
   * Main taper: field slope toward drain lines (two-way) or straight to each drain (four-way),
   * plus edge drains. Crickets are a separate layer laid on top of the main taper:
   * triangular facets, each with a straight valley (toe line) where cricket thickness is the
   * toe thickness, rising at the cricket slope perpendicular to the valley.
   */
  function rayHit(o, dir, roof) {
    let best = null;
    for (let i = 0; i < roof.length; i++) {
      const a = roof[i], b = roof[(i + 1) % roof.length];
      const ex = b.x - a.x, ey = b.y - a.y;
      const den = dir.x * ey - dir.y * ex;
      if (Math.abs(den) < 1e-12) continue;
      const t = ((a.x - o.x) * ey - (a.y - o.y) * ex) / den;
      const u = ((a.x - o.x) * dir.y - (a.y - o.y) * dir.x) / den;
      if (t > 1e-6 && u >= -1e-9 && u <= 1 + 1e-9 && (!best || t < best.t)) best = { t, edge: i };
    }
    return best;
  }
  function makeFacet(va, vb, q, sc, toe) {
    const dx = vb.x - va.x, dy = vb.y - va.y, L = Math.hypot(dx, dy) || 1;
    let n = { x: -dy / L, y: dx / L };
    if ((q.x - va.x) * n.x + (q.y - va.y) * n.y < 0) n = { x: -n.x, y: -n.y };
    const tri = [va, vb, q];
    const bb = bbox(tri);
    const dmax = Math.max(0, (q.x - va.x) * n.x + (q.y - va.y) * n.y);
    return { va, vb, q, n, sc, toe, tri, bb, dmax };
  }
  function inTri(x, y, t, eps = 1e-7) {
    const s = (p, a, b) => (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
    const p = { x, y };
    const d1 = s(p, t[0], t[1]), d2 = s(p, t[1], t[2]), d3 = s(p, t[2], t[0]);
    const neg = d1 < -eps || d2 < -eps || d3 < -eps, pos = d1 > eps || d2 > eps || d3 > eps;
    return !(neg && pos);
  }

  function cricketSeries(P) {
    const sc = +P.design.cricketSlope;
    let ser = null, bd = Infinity;
    (P.series || []).forEach(s => { const df = Math.abs(s.slope - sc); if (df < bd && s.panels.length) { bd = df; ser = s; } });
    if (!ser || bd > Math.max(0.03, 0.2 * sc)) return null;
    return ser;
  }

  function buildField(P) {
    const d = P.design;
    const sf = +d.fieldSlope, sc = +d.cricketSlope, tmin = +d.tmin;
    const ratio = Math.max(0.5, +d.cricketRatio || 3);
    const mode = d.mode, axis = d.axis === 'x' ? 'x' : 'y';
    const roof = P.roof;
    const curbs = P.curbs || [];
    const gutters = (P.gutters || []).filter(i => i < roof.length);
    const drains = P.drains || [];
    const cs = cricketSeries(P);
    const toe = cs ? Math.min(...cs.panels.map(p => +p.lo)) : 0;
    const notes = [];

    // along-line (u) and cross-line (w) coordinates for two-way layouts
    const U = p => axis === 'y' ? p.x : p.y, W = p => axis === 'y' ? p.y : p.x;
    const XY = (u, w) => axis === 'y' ? { x: u, y: w } : { x: w, y: u };

    const sources = [];
    let lines = [];
    if (mode === '4way') drains.forEach(dr => sources.push({ t: 'pt', x: dr.x, y: dr.y }));
    else {
      const sorted = drains.map((dr, i) => ({ dr, i, w: W(dr), u: U(dr) })).sort((a, b) => a.w - b.w);
      sorted.forEach(o => {
        const ln = lines.find(l => Math.abs(l.w - o.w) <= 1.0);
        if (ln) { ln.items.push(o); ln.w = ln.items.reduce((a, b) => a + b.w, 0) / ln.items.length; }
        else lines.push({ w: o.w, items: [o] });
      });
      lines.forEach(l => { l.items.sort((a, b) => a.u - b.u); sources.push({ t: 'line', w: l.w }); });
    }
    gutters.forEach(i => sources.push({ t: 'seg', a: roof[i], b: roof[(i + 1) % roof.length] }));

    function base(x, y) {
      if (!sources.length) return tmin;
      let best = Infinity;
      for (const s of sources) {
        let r;
        if (s.t === 'pt') r = sf * Math.max(Math.abs(x - s.x), Math.abs(y - s.y));
        else if (s.t === 'line') r = sf * Math.abs((axis === 'y' ? y : x) - s.w);
        else r = sf * distSeg(x, y, s.a, s.b);
        if (r < best) best = r;
      }
      return tmin + best;
    }
    const inCurb = (x, y) => curbs.some(c => x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h);

    const crickets = [];
    const addCricket = (kind, label, facets, outline, extra) => {
      const c = { kind, label, facets, outline, ...extra };
      facets.forEach(f => { f.cricket = c; });
      crickets.push(c);
    };

    // drain-line crickets: between drains, and from end drains to walls
    if (mode !== '4way') {
      lines.forEach((l, li) => {
        const it = l.items;
        for (let k = 0; k + 1 < it.length; k++) {
          const u1 = it[k].u, u2 = it[k + 1].u, span = u2 - u1;
          if (span < 1) continue;
          const a = span / 2, L = span / ratio;
          const D1 = XY(u1, l.w), D2 = XY(u2, l.w), M = XY(u1 + a, l.w);
          const Ap = XY(u1 + a, l.w - L), An = XY(u1 + a, l.w + L);
          const f = [makeFacet(D1, Ap, M, sc, toe), makeFacet(D2, Ap, M, sc, toe), makeFacet(D1, An, M, sc, toe), makeFacet(D2, An, M, sc, toe)];
          const tag = (i) => (drains[i].type === 'scupper' ? 'SC-' : 'D-') + (i + 1);
          const shed = sc * a / Math.hypot(a, L);
          if (shed <= sf + 1e-9) notes.push(`Cricket ${tag(it[k].i)} to ${tag(it[k + 1].i)} won't shed water across the drain line at a ${ratio}:1 ratio — raise the cricket slope or the ratio.`);
          addCricket('line', `${tag(it[k].i)}–${tag(it[k + 1].i)}`, f, [D1, Ap, D2, An], { width: span, length: L, valleys: [[D1, Ap], [D2, Ap], [D1, An], [D2, An]], ridges: [[Ap, An], [D1, D2]] });
        }
        [[it[0], -1], [it[it.length - 1], 1]].forEach(([o, sgn]) => {
          const D = XY(o.u, l.w);
          const dir = axis === 'y' ? { x: sgn, y: 0 } : { x: 0, y: sgn };
          const hit = rayHit(D, dir, roof);
          if (!hit || hit.t < 1 || gutters.includes(hit.edge)) return;
          const e = hit.t, L = 2 * e / ratio;
          const Wp = XY(o.u + sgn * e, l.w), Ap = XY(o.u + sgn * e, l.w - L), An = XY(o.u + sgn * e, l.w + L);
          const tag = (drains[o.i].type === 'scupper' ? 'SC-' : 'D-') + (o.i + 1);
          addCricket('end', `${tag} to edge`, [makeFacet(D, Ap, Wp, sc, toe), makeFacet(D, An, Wp, sc, toe)], [D, Ap, An], { width: 2 * L, length: e, valleys: [[D, Ap], [D, An]], ridges: [[D, Wp]] });
        });
      });
    }

    // curb crickets on the high side(s) of each curb
    if (d.curbCrickets !== false && sf > 0) {
      curbs.forEach((c, ci) => {
        const sides = [
          { name: 'N', c1: { x: c.x, y: c.y }, c2: { x: c.x + c.w, y: c.y }, nx: 0, ny: -1, L: c.w },
          { name: 'S', c1: { x: c.x, y: c.y + c.h }, c2: { x: c.x + c.w, y: c.y + c.h }, nx: 0, ny: 1, L: c.w },
          { name: 'W', c1: { x: c.x, y: c.y }, c2: { x: c.x, y: c.y + c.h }, nx: -1, ny: 0, L: c.h },
          { name: 'E', c1: { x: c.x + c.w, y: c.y }, c2: { x: c.x + c.w, y: c.y + c.h }, nx: 1, ny: 0, L: c.h },
        ];
        sides.forEach(s => {
          const m = { x: (s.c1.x + s.c2.x) / 2, y: (s.c1.y + s.c2.y) / 2 };
          const tNear = base(m.x + s.nx * 0.5, m.y + s.ny * 0.5), tFar = base(m.x + s.nx * 3, m.y + s.ny * 3);
          const g = (tFar - tNear) / 2.5;
          if (g > 0.4 * sf) {
            const len = s.L / ratio;
            const ap = { x: m.x + s.nx * len, y: m.y + s.ny * len };
            addCricket('curb', `${c.name || 'Curb'} ${s.name}`, [makeFacet(s.c1, ap, m, sc, toe), makeFacet(s.c2, ap, m, sc, toe)], [s.c1, ap, s.c2], { width: s.L, length: len, valleys: [[s.c1, ap], [s.c2, ap]], ridges: [[m, ap]] });
          }
        });
      });
    }

    const facets = crickets.flatMap(c => c.facets);
    function cricketAt(x, y) {
      let best = null, bc = -1;
      for (const f of facets) {
        if (x < f.bb.x0 - 1e-6 || x > f.bb.x1 + 1e-6 || y < f.bb.y0 - 1e-6 || y > f.bb.y1 + 1e-6) continue;
        if (!inTri(x, y, f.tri)) continue;
        const dist = Math.max(0, (x - f.va.x) * f.n.x + (y - f.va.y) * f.n.y);
        const c = f.toe + f.sc * dist;
        if (c > bc) { bc = c; best = { f, c, dist }; }
      }
      return best;
    }
    function T(x, y) {
      if (inCurb(x, y)) return null;
      const ck = cricketAt(x, y);
      return base(x, y) + (ck ? ck.c : 0);
    }
    const Tm = (x, y) => inCurb(x, y) ? null : base(x, y);
    const inRoof = (x, y) => pointInPoly(x, y, roof) && !inCurb(x, y);
    crickets.forEach(c => {
      const m = c.facets.reduce((a, f) => Math.max(a, f.dmax), 0);
      c.ridgeC = toe + sc * m;
    });
    return { T, Tm, base, inRoof, inCurb, crickets, facets, cricketAt, sources, lines, toe, cs, notes, ratio };
  }

  /* ---------- flat fill combos ---------- */
  function fillCombos(fills, maxLayers) {
    // every distinct stack of up to maxLayers boards; matching picks among them
    const list = [...new Set(fills.filter(f => f > 0))].sort((a, b) => b - a);
    const out = [{ sum: 0, boards: [] }];
    function rec(start, boards, sum) {
      if (boards.length) out.push({ sum: r16(sum), boards: boards.slice() });
      if (boards.length >= maxLayers) return;
      for (let i = start; i < list.length; i++) { boards.push(list[i]); rec(i, boards, sum + list[i]); boards.pop(); }
    }
    rec(0, [], 0);
    const distinct = b => new Set(b).size;
    return out.sort((a, b) => a.sum - b.sum || a.boards.length - b.boards.length || distinct(a.boards) - distinct(b.boards) || b.boards[0] - a.boards[0]);
  }

  /* A series is a repeating profile: its panels run in order from the thinnest, and once
   * the last panel is reached the cycle starts over on flat fill equal to the cycle's rise
   * (Carlisle 1/4": X, Y, X+2, Y+2, X+4 ...). */
  function seriesCycle(series) {
    const ps = series.panels.slice().sort((a, b) => a.lo - b.lo);
    const lo0 = ps[0].lo, hiN = Math.max(...ps.map(p => p.hi));
    return { ps, lo0, rise: Math.max(1e-6, hiN - lo0) };
  }
  function bestFill(target, combos, rise) {
    // Each cycle adds a full rise of flat fill (2" on standard profiles), so stack fill from
    // boards that are whole multiples of the rise: 4" = 4, 6" = 4+2, never 3+3.
    const offRise = b => rise ? Math.abs(b / rise - Math.round(b / rise)) > 0.01 : 0;
    let best = null;
    for (const c of combos) {
      const e = target - c.sum;
      if (e < -0.07) continue;           // never build above the target by more than a hair
      const score = Math.abs(e) * 100 + c.boards.length + 1.5 * c.boards.filter(offRise).length;
      if (!best || score < best.score) best = { score, fill: c, err: e };
    }
    return best;
  }
  function matchPanel(series, Tlow, combos) {
    if (!series.panels.length) return null;
    const { ps, lo0, rise } = seriesCycle(series);
    const tol = 0.07;
    const k = Math.max(0, Math.floor((Tlow - lo0 + tol) / rise));
    const r = Tlow - k * rise;                       // position within the cycle
    let panel = ps[0];
    for (const p of ps) if (p.lo <= r + tol) panel = p;
    const fillNeed = Tlow - panel.lo;
    const m = bestFill(fillNeed, combos, rise);
    if (!m) return Tlow < lo0 - tol ? { panel, fill: combos[0], err: Tlow - panel.lo, cycle: 0 } : null;
    return { panel, fill: m.fill, err: m.err, cycle: k };
  }
  function matchFlat(T, combos) {
    let best = null;
    for (const c of combos) {
      const e = T - c.sum;
      const score = Math.abs(e) * 100 + c.boards.length;
      if (!best || score < best.score) best = { score, fill: c, err: e };
    }
    return best;
  }

  /* ---------- full analysis ---------- */
  function analyze(P) {
    const d = P.design;
    const F = buildField(P);
    const roof = P.roof;
    const M = +d.module || 4;
    const bb = bbox(roof);
    let ox = +d.gridOx || 0, oy = +d.gridOy || 0;
    if (d.autoGrid !== false && P.drains && P.drains.length) { ox = P.drains[0].x; oy = P.drains[0].y; }
    const combos = fillCombos(P.fills || [], +d.maxFillLayers || 3);
    const series = P.series || [];
    const warnings = [];
    if (!(P.drains || []).length && !(P.gutters || []).length) warnings.push('No drains, scuppers, or edge drains defined — roof is flat at minimum thickness.');

    const i0 = Math.floor((bb.x0 - ox) / M), i1 = Math.ceil((bb.x1 - ox) / M);
    const j0 = Math.floor((bb.y0 - oy) / M), j1 = Math.ceil((bb.y1 - oy) / M);
    const N = 8, h = 0.02;
    const cells = [];
    const unmatched = new Set();

    for (let i = i0; i < i1; i++) for (let j = j0; j < j1; j++) {
      const x0 = ox + i * M, y0 = oy + j * M, x1 = x0 + M, y1 = y0 + M;
      const clip = clipPolyRect(roof, x0, y0, x1, y1);
      if (clip.length < 3) continue;
      let area = Math.abs(polyArea(clip));
      (P.curbs || []).forEach(c => { area -= rectOverlap(x0, y0, x1, y1, c.x, c.y, c.x + c.w, c.y + c.h); });
      if (area < 0.05) continue;

      // sample
      let samples = [];
      for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) {
        const x = x0 + (a + 0.5) * M / N, y = y0 + (b + 0.5) * M / N;
        const t = F.Tm(x, y);
        if (t == null) continue;
        const inside = pointInPoly(x, y, roof);
        const tx1 = F.Tm(x + h, y), tx0 = F.Tm(x - h, y), ty1 = F.Tm(x, y + h), ty0 = F.Tm(x, y - h);
        const gx = (tx1 != null && tx0 != null) ? (tx1 - tx0) / (2 * h) : 0;
        const gy = (ty1 != null && ty0 != null) ? (ty1 - ty0) / (2 * h) : 0;
        let dir, slope;
        if (Math.max(Math.abs(gx), Math.abs(gy)) < 0.015) { dir = 'F'; slope = 0; }
        else if (Math.abs(gx) >= Math.abs(gy)) { dir = gx > 0 ? 'E' : 'W'; slope = Math.abs(gx); }

        const item = hit.kind === 'vertex' ? P.roof[hit.i] : hit.kind === 'drain' ? P.drains[hit.i] : P.curbs[hit.i];
        drag = { kind: 'move', hit, start: p, orig: { x: item.x, y: item.y }, moved: false };
      } else { sel = null; drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, v: { ...shown } }; }
      renderPlan(); syncSelection();
    } else if (tool === 'drain') {
      checkpoint(); P.drains.push({ x: snapV(p.x), y: snapV(p.y), type: 'drain' }); sel = { kind: 'drain', i: P.drains.length - 1 }; changed(true);
    } else if (tool === 'scupper') {
      const ed = nearestEdge(p); if (ed) { checkpoint(); P.drains.push({ ...ed.pt, type: 'scupper' }); sel = { kind: 'drain', i: P.drains.length - 1 }; changed(true); }
    } else if (tool === 'curb') {
      drag = { kind: 'curb', start: { x: snapV(p.x), y: snapV(p.y) }, cur: null };
    } else if (tool === 'edge') {
      const ed = nearestEdge(p);
      if (ed && ed.d < pxToFt(14)) {
        checkpoint(); const g = P.gutters || (P.gutters = []);
        const k = g.indexOf(ed.i); if (k >= 0) g.splice(k, 1); else g.push(ed.i);
        changed(true); toast(k >= 0 ? 'Edge drain removed' : 'Edge set to drain off the roof');
      }
    } else if (tool === 'roof') {
      const q = { x: snapV(p.x), y: snapV(p.y) };
      if (!draft) draft = [];
      if (draft.length >= 3 && Math.hypot(q.x - draft[0].x, q.y - draft[0].y) < pxToFt(12)) finishRoof();
      else if (!draft.length || q.x !== draft[draft.length - 1].x || q.y !== draft[draft.length - 1].y) draft.push(q);
      renderOverlay(); setHint();
    }
  });
  svg.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = toPlan(e); hoverP = p;
    updateStatus(p);
    if (!drag) { if (tool !== 'select' && tool !== 'pan') renderOverlay(); return; }
    if (drag.kind === 'pinch' && pointers.size === 2) {
      const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const f = drag.d0 / d; const m = drag.mid, v = drag.v;
      view = { x: m.x - (m.x - v.x) * f, y: m.y - (m.y - v.y) * f, w: v.w * f, h: v.h * f }; applyView(); renderOverlay(); return;
    }
    if (drag.kind === 'pan') {
      const r = svg.getBoundingClientRect(); const k = drag.v.w / r.width;
      view = { ...drag.v, x: drag.v.x - (e.clientX - drag.sx) * k, y: drag.v.y - (e.clientY - drag.sy) * k };
      applyView(); return;
    }
    if (drag.kind === 'move') {
      const h = drag.hit; const nx = snapV(drag.orig.x + p.x - drag.start.x), ny = snapV(drag.orig.y + p.y - drag.start.y);
      const item = h.kind === 'vertex' ? P.roof[h.i] : h.kind === 'drain' ? P.drains[h.i] : P.curbs[h.i];
      if (item.x !== nx || item.y !== ny) {
        if (h.kind === 'drain' && item.type === 'scupper') { const ed = nearestEdge(p); if (ed) { item.x = ed.pt.x; item.y = ed.pt.y; } }
        else { item.x = nx; item.y = ny; }
        drag.moved = true; schedule();
      }
      return;
    }
    if (drag.kind === 'curb') { drag.cur = { x: snapV(p.x), y: snapV(p.y) }; renderOverlay(); }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (!drag) return;

      const r = rectFrom(drag.start, drag.cur);
      if (r.w >= 1 && r.h >= 1) { checkpoint(); P.curbs.push({ ...r, name: 'CURB-' + (P.curbs.length + 1) }); sel = { kind: 'curb', i: P.curbs.length - 1 }; changed(true); }
    }
    if (drag.kind === 'move') { if (drag.moved) changed(true); else history.pop(); }
    if (drag.kind === 'pinch' && pointers.size) { drag = null; return; }
    drag = null; renderOverlay();
  }
  svg.addEventListener('pointerup', endPointer);

  function finishRoof() {

  }

    P.roof.splice(i, 1);

  }

  document.addEventListener('keydown', e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { if (typing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (typing) return;
    if (e.key === ' ') { spaceDown = true; e.preventDefault(); }
    if (e.key === 'Delete' || e.key === 'Backspace') { deleteSel(); e.preventDefault(); }
    if (e.key === 'Escape') { draft = null; drag = null; sel = null; renderPlan(); setHint(); }
    if (e.key === 'Enter' && tool === 'roof') finishRoof();
    const map = { v: 'select', r: 'roof', d: 'drain', s: 'scupper', c: 'curb', e: 'edge', h: 'pan' };
    if (!e.ctrlKey && !e.metaKey && map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);

    drain: 'Click to place a roof drain. Taper falls to it at the minimum thickness.',
    scupper: 'Click near a roof edge to place a scupper on it.',
    curb: 'Drag a rectangle to add a curb or penetration. Crickets are added on its high side.',
    edge: 'Click a roof edge to make it drain off the roof (gutter or edge drain). Click again to undo.',
    pan: 'Drag to pan. Scroll or pinch to zoom.',

    tool = t; if (t !== 'roof') draft = null;

    if (!A) return;
    const t = A.F.inRoof(p.x, p.y) ? A.F.T(p.x, p.y) : null;
    let s = `${p.x.toFixed(1)}', ${p.y.toFixed(1)}'`;
    if (t != null) {
      s += `  ·  taper ${t.toFixed(2)}"  ·  total ${(t + (A.R ? A.R.baseT : 0)).toFixed(2)}"`;
      const ck = A.F.cricketAt(p.x, p.y);
      const band = ck && (A.bands || []).find(b => b.facet === A.F.facets.indexOf(ck.f) && E.pointInPoly(p.x, p.y, b.poly));
      const c = A.cells.find(c => p.x >= c.x0 && p.x < c.x1 && p.y >= c.y0 && p.y < c.y1);
      if (ck) s += `  ·  cricket ${ck.f.cricket.label}: +${ck.c.toFixed(2)}"` + (band && band.panel ? ` (${band.panel.code}${band.fill && band.fill.sum ? ' on ' + band.fill.boards.map(b => b + '"').join(' + ') : ''})` : '');
